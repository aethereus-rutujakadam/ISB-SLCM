<template>
    <lightning-card title="Case Feedback" icon-name="standard:feedback">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <lightning-combobox
                name="overallRating"
                label="Overall Rating"
                placeholder="Select Rating (1-5)"
                options={ratingOptions}
                value={overallRating}
                onchange={handleChange}>
            </lightning-combobox>

            <lightning-textarea
                name="comments"
                label="Comments"
                value={comments}
                onchange={handleChange}>
            </lightning-textarea>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Submit Feedback"
                    variant="brand"
                    onclick={handleSubmit}
                    disabled={isSubmitting}>
                </lightning-button>
            </div>

            <template if:true={successMessage}>
                <p class="slds-text-color_success slds-m-top_small">{successMessage}</p>
            </template>
            <template if:true={errorMessage}>
                <p class="slds-text-color_error slds-m-top_small">{errorMessage}</p>
            </template>
        </div>
    </lightning-card>
</template>
