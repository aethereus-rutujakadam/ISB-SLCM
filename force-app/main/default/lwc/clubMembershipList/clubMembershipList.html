<template>
    <lightning-card title="My Memberships" icon-name="standard:contact">
        <div slot="actions">
            <lightning-button
                label="Apply For Professional Club"
                onclick={handleApplyClick}
                variant="brand"
                icon-name="utility:add"
                class="slds-m-right_x-small">
            </lightning-button>
            <lightning-button
                label="Request for new SIG"
                onclick={handleRequestSIGClick}
                variant="neutral"
                icon-name="utility:add">
            </lightning-button>
        </div>
        
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-vertical_large">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <lightning-tabset>
                <lightning-tab label="Active Memberships">
                    <template if:true={hasMemberships}>
                        <div class="slds-p-around_medium slds-border_top">
                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
                                <h2 class="slds-text-heading_small">
                                    <lightning-icon icon-name="standard:user" size="small" class="slds-m-right_x-small"></lightning-icon>
                                    Professional Memberships
                                </h2>
                            </div>
                            <!-- Changes made by Diksha: Datatable for Professional Clubs -->
                            <lightning-datatable
                                key-field="membershipId"
                                data={memberships}
                                columns={columns}
                                hide-checkbox-column
                                show-row-number-column
                                onrowaction={handleRowAction}
                                class="full-width-table">
                            </lightning-datatable>
                        </div>
                    </template>

                    <div style="height: 2rem;"></div>

                    <template if:true={hasOtherMemberships}>
                        <div class="slds-p-around_medium slds-border_top">
                            <h2 class="slds-text-heading_small slds-m-bottom_medium">
                                <lightning-icon icon-name="standard:groups" size="small" class="slds-m-right_x-small"></lightning-icon>
                                Social Club Memberships
                            </h2>
                            <!-- Changes made by Diksha: Updated to use socialColumns to hide button -->
                            <lightning-datatable
                                key-field="membershipId"
                                data={otherMemberships}
                                columns={socialColumns}
                                hide-checkbox-column
                                show-row-number-column
                                class="full-width-table">
                            </lightning-datatable>
                        </div>
                    </template>

                    <template if:false={hasMemberships}>
                        <template if:false={hasOtherMemberships}>
                            <div class="slds-align_absolute-center slds-p-vertical_large slds-p-horizontal_medium">
                                <lightning-icon icon-name="utility:info" size="small" class="slds-m-right_small"></lightning-icon>
                                <p class="slds-text-body_regular">No active club memberships found.</p>
                            </div>
                        </template>
                    </template>
                </lightning-tab>

                <lightning-tab label="Pending Requests">
                    <div class="slds-p-around_medium slds-border_top">
                        <h2 class="slds-text-heading_small slds-m-bottom_medium">
                            <lightning-icon icon-name="standard:record" size="small" class="slds-m-right_x-small"></lightning-icon>
                            SIG Requests Raised
                        </h2>
                        <template if:true={hasSigRequests}>
                            <lightning-datatable
                                key-field="requestId"
                                data={sigRequests}
                                columns={requestColumns}
                                hide-checkbox-column
                                show-row-number-column
                                class="full-width-table">
                            </lightning-datatable>
                        </template>
                         <template if:false={hasSigRequests}>
                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-text-align_center">
                                <p class="slds-text-body_regular">No SIG requests found.</p>
                            </div>
                        </template>
                    </div>
                    <div style="height: 2rem;"></div>
                    <div class="slds-p-around_medium slds-border_top">
                        <h2 class="slds-text-heading_small slds-m-bottom_medium">
                            <lightning-icon icon-name="standard:contact_list" size="small" class="slds-m-right_x-small"></lightning-icon>
                            Pending/Other Club Memberships
                        </h2>
                        <template if:true={hasPendingMemberships}>
                            <lightning-datatable
                                key-field="membershipId"
                                data={pendingMemberships}
                                columns={socialColumns}
                                hide-checkbox-column
                                show-row-number-column
                                class="full-width-table">
                            </lightning-datatable>
                        </template>
                        <template if:false={hasPendingMemberships}>
                            <div class="slds-box slds-theme_shade slds-theme_alert-texture slds-text-align_center">
                                <p class="slds-text-body_regular">No pending or other memberships found.</p>
                            </div>
                        </template>
                    </div>
                </lightning-tab>
            </lightning-tabset>
        </template>

        <template if:true={showFlow}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeFlow}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Professional Club Registration</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-flow onstatuschange={handleFlowStatusChange}></lightning-flow>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showReassignModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeReassignModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Reassign Professional Club</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">Your current membership will be marked as Inactive. The new request will stay Inactive until approval.</p>
                        <lightning-combobox
                            label="Search/Select New Club"
                            value={selectedNewClubId}
                            options={availableClubs}
                            onchange={handleClubChange}
                            placeholder="Select a club...">
                        </lightning-combobox>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeReassignModal} class="slds-m-right_x-small"></lightning-button>
                        <lightning-button label="Confirm Reassignment" variant="brand" onclick={submitReassignment}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
