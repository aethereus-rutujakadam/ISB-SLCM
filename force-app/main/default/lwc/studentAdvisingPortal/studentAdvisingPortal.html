                                        <span class="ws-detail-label">Sessions:</span>
                                        <span class="ws-detail-value">{selectedRegistrationForModal.Workshop__r.Total_Sessions__c} sessions</span>
                                    </div>
                                </div>
                            </div>

                            <h3 class="ws-modal-section-title slds-m-top_medium">Your Sessions:</h3>
                            <template if:true={selectedRegistrationForModal.Workshop_Attendances__r}>
                                <div class="ws-attendance-list">
                                    <template for:each={selectedRegistrationForModal.Workshop_Attendances__r} for:item="att">
                                        <article key={att.Id} class="ws-attendance-card">
                                            <div class="ws-attendance-header">
                                                <h4 class="ws-attendance-title">Session {att.Workshop_Session__r.Session_Number__c}</h4>
                                                <span class="ws-badge ws-badge--info">{att.Attendance_Status__c}</span>
                                            </div>
                                            <div class="ws-attendance-details">
                                                <div class="ws-attendance-row">
                                                    <span class="ws-detail-label">Start Date:</span>
                                                    <span>
                                                        <lightning-formatted-date-time
                                                            value={att.Workshop_Batch__r.Start_DateTime__c}
                                                            year="numeric"
                                                            month="short"
                                                            day="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>
                                                <div class="ws-attendance-row">
                                                    <span class="ws-detail-label">Start Time:</span>
                                                    <span>
                                                        <lightning-formatted-date-time
                                                            value={att.Workshop_Batch__r.Start_DateTime__c}
                                                            hour="numeric"
                                                            minute="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>
                                                <div class="ws-attendance-row">
                                                    <span class="ws-detail-label">End Date:</span>
                                                    <span>
                                                        <lightning-formatted-date-time
                                                            value={att.Workshop_Batch__r.End_DateTime__c}
                                                            year="numeric"
                                                            month="short"
                                                            day="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>
                                                <div class="ws-attendance-row">
                                                    <span class="ws-detail-label">End Time:</span>
                                                    <span>
                                                        <lightning-formatted-date-time
                                                            value={att.Workshop_Batch__r.End_DateTime__c}
                                                            hour="numeric"
                                                            minute="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </span>
                                                </div>
                                                <div class="ws-attendance-row">
                                                    <span class="ws-detail-label">Mode:</span>
                                                    <span>{att.Workshop_Batch__r.Mode__c}</span>
                                                </div>
                                                <template if:true={att.Workshop_Batch__r.Location__c}>
                                                    <div class="ws-attendance-row">
                                                        <span class="ws-detail-label">Location:</span>
                                                        <span>{att.Workshop_Batch__r.Location__c}</span>
                                                    </div>
                                                </template>
                                                <template if:true={att.Workshop_Batch__r.Meeting_Link__c}>
                                                    <div class="ws-attendance-row">
                                                        <span class="ws-detail-label">Link:</span>
                                                        <a href={att.Workshop_Batch__r.Meeting_Link__c} target="_blank" class="ws-attendance-link">
                                                            Join Meeting
                                                        </a>
                                                    </div>
                                                </template>
                                            </div>
                                        </article>
                                    </template>
                                </div>
                            </template>
                            <template if:false={selectedRegistrationForModal.Workshop_Attendances__r}>
                                <p class="ws-empty-note">No attendance records found for this registration.</p>
                            </template>
                        </div>

                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={handleCloseRegistrationDetailsModal}>Close</button>
                        </footer>
                    </div>
                </div>
            </template>

        </template>
        <!-- END WORKSHOPS TAB -->

    </div>
</template>
