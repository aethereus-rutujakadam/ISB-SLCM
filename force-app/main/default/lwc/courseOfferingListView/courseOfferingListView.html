<template>
    <!-- ═══════════════════════════════════════════════════════════
         CourseOffering List View
         ═══════════════════════════════════════════════════════════ -->
    <div class="col-container">

        <!-- ── Card Shell ──────────────────────────────────────────── -->
        <lightning-card>
            <!-- Card Header -->
            <div slot="title" class="card-title-slot">
                <lightning-icon icon-name="standard:education" size="small" class="slds-m-right_x-small"></lightning-icon>
                <span class="slds-text-heading_small card-heading">Course Offerings</span>
                <span class="record-count-badge" if:true={result}>
                    {result.totalCount} record{pluralSuffix}
                </span>
            </div>

            <!-- Card Actions -->
            <div slot="actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    variant="border-filled"
                    alternative-text="Refresh"
                    title="Refresh"
                    onclick={handleRefresh}>
                </lightning-button-icon>
            </div>

            <!-- ── Filter Bar ─────────────────────────────────────── -->
            <div class="filter-bar slds-p-around_small slds-grid slds-wrap slds-gutters_x-small">

                <!-- Academic Year -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 filter-col">
                    <lightning-combobox
                        name="academicYear"
                        label="Academic Year"
                        placeholder="All Academic Years"
                        value={filters.academicYear}
                        options={academicYearOptions}
                        variant="label-stacked"
                        onchange={handleAcademicYearChange}
                        disabled={isLoading}>
                    </lightning-combobox>
                </div>

                <!-- Program -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 filter-col">
                    <lightning-combobox
                        name="program"
                        label="Program"
                        placeholder="All Programs"
                        value={filters.program}
                        options={programOptions}
                        variant="label-stacked"
                        onchange={handleProgramChange}
                        disabled={isLoading}>
                    </lightning-combobox>
                </div>

                <!-- Academic Term -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 filter-col">
                    <lightning-combobox
                        name="academicTerm"
                        label="Academic Term"
                        placeholder="All Terms"
                        value={filters.academicTerm}
                        options={academicTermOptions}
                        variant="label-stacked"
                        onchange={handleAcademicTermChange}
                        disabled={isLoading}>
                    </lightning-combobox>
                </div>

                <!-- Academic Session -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 filter-col">
                    <lightning-combobox
                        name="academicSession"
                        label="Academic Session"
                        placeholder="All Sessions"
                        value={filters.academicSession}
                        options={academicSessionOptions}
                        variant="label-stacked"
                        onchange={handleAcademicSessionChange}
                        disabled={isLoading}>
                    </lightning-combobox>
                </div>

                <!-- Clear Filters button -->
                <div class="slds-col slds-size_1-of-1 filter-actions slds-p-top_small">
                    <lightning-button
                        label="Clear Filters"
                        icon-name="utility:clear"
                        icon-position="left"
                        variant="neutral"
                        onclick={handleClearFilters}
                        disabled={isLoading}>
                    </lightning-button>
                    <span class="filter-hint" if:true={hasActiveFilters}>
                        <lightning-icon icon-name="utility:filter" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        Filters active
                    </span>
                </div>
            </div>

            <!-- ── Loading Spinner ────────────────────────────────── -->
            <template if:true={isLoading}>
                <div class="spinner-container">
                    <lightning-spinner
                        alternative-text="Loading Course Offerings…"
                        size="medium"
                        variant="brand">
                    </lightning-spinner>
                </div>
            </template>

            <!-- ── Error State ────────────────────────────────────── -->
            <template if:true={hasError}>
                <div class="error-container slds-p-around_medium">
                    <lightning-icon icon-name="utility:error" variant="error" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-text-color_error">{errorMessage}</span>
                </div>
            </template>

            <!-- ── Empty State ────────────────────────────────────── -->
            <template if:true={isEmpty}>
                <div class="empty-state slds-p-around_large slds-text-align_center">
                    <lightning-icon icon-name="utility:search" size="large" class="empty-icon"></lightning-icon>
                    <h3 class="slds-text-heading_small slds-m-top_small">No Records Found</h3>
                    <p class="slds-text-color_weak slds-m-top_x-small">
                        Try adjusting your filters to find Course Offerings.
                    </p>
                </div>
            </template>

            <!-- ── Data Table (Now using lightning-datatable for adjustable column width) ── -->
            <template if:true={hasRecords}>
                <div class="table-container">
                    <lightning-datatable
                        key-field="id"
                        data={result.records}
                        columns={columns}
                        onsort={handleSort}
                        sorted-by={sortField}
                        sorted-direction={sortDirection}
                        hide-checkbox-column
                        default-sort-direction="asc"
                        class="slds-table_bordered slds-table_col-bordered">
                    </lightning-datatable>
                </div>

                <!-- ── Pagination Bar ─────────────────────────────── -->
                <div class="pagination-bar slds-grid slds-grid_align-spread slds-p-horizontal_medium slds-p-vertical_small">

                    <!-- Left: rows per page + summary -->
                    <div class="slds-grid slds-grid_vertical-align-center pagination-left">
                        <span class="slds-text-body_small slds-m-right_small page-summary">
                            Showing {pageStart}–{pageEnd} of {result.totalCount}
                        </span>
                        <lightning-combobox
                            name="pageSize"
                            label=""
                            variant="label-hidden"
                            value={pageSizeStr}
                            options={pageSizeOptions}
                            onchange={handlePageSizeChange}
                            class="page-size-picker">
                        </lightning-combobox>
                        <span class="slds-text-body_small slds-m-left_x-small">per page</span>
                    </div>

                    <!-- Right: page navigation -->
                    <div class="slds-grid slds-grid_vertical-align-center pagination-right">
                        <lightning-button-icon
                            icon-name="utility:chevronleft"
                            alternative-text="First Page"
                            title="First Page"
                            variant="border-filled"
                            size="small"
                            disabled={isFirstPage}
                            onclick={handleFirstPage}
                            class="slds-m-right_xx-small">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:left"
                            alternative-text="Previous Page"
                            title="Previous"
                            variant="border-filled"
                            size="small"
                            disabled={isFirstPage}
                            onclick={handlePrevPage}
                            class="slds-m-right_xx-small">
                        </lightning-button-icon>

                        <span class="page-indicator slds-text-body_small">
                            Page {currentPage} of {result.totalPages}
                        </span>

                        <lightning-button-icon
                            icon-name="utility:right"
                            alternative-text="Next Page"
                            title="Next"
                            variant="border-filled"
                            size="small"
                            disabled={isLastPage}
                            onclick={handleNextPage}
                            class="slds-m-left_xx-small">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:chevronright"
                            alternative-text="Last Page"
                            title="Last Page"
                            variant="border-filled"
                            size="small"
                            disabled={isLastPage}
                            onclick={handleLastPage}
                            class="slds-m-left_xx-small">
                        </lightning-button-icon>
                    </div>

                </div>
            </template>

        </lightning-card>
    </div>
</template>
