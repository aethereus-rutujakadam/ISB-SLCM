<template>
    <lightning-card title="Upload Course Managers from Excel" icon-name="doctype:xlsx">
        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_medium">
                Upload an Excel file to bulk-create Course Manager assignments. 
                The system will match Course Offerings and create manager records automatically.<br />
                <strong>Required columns: Owner | Courses | CourseCode | CourseType | Location | AcademicYear | AcademicTerm | Roles</strong>
            </p>

            <!-- Upload Messages Section -->
            <template lwc:if={uploadMessages.length}>
                <div class="slds-m-bottom_medium">
                    <template for:each={uploadMessages} for:item="message">
                        <div key={message.text} class={message.cssClass} role="alert">
                            <span class="slds-assistive-text">{message.type}</span>
                            <button class="slds-button slds-button_icon slds-notify__close slds-button_icon-inverse" type="button" title="Close this alert" onclick={clearMessages}>
                                <svg class="slds-button__icon" aria-hidden="true" viewBox="0 0 24 24">
                                    <path d="M12 10.28L5.22 3.5a.75.75 0 00-1.06 1.06L10.72 11.34 4.16 17.9a.75.75 0 101.06 1.06l6.56-6.56 6.56 6.56a.75.75 0 101.06-1.06l-6.56-6.56 6.56-6.56a.75.75 0 00-1.06-1.06L12 10.28z"></path>
                                </svg>
                            </button>
                            <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                                {message.type === 'error' ? 'Error' : message.type === 'warning' ? 'Warning' : 'Info'}
                            </h2>
                            <p>{message.text}</p>
                        </div>
                    </template>
                </div>
            </template>
            <lightning-input
                type="file"
                accept=".xls,.xlsx"
                label="Select Excel File"
                onchange={handleFileChange}
                disabled={isLoading}>
            </lightning-input>

            <!-- Record count -->
            <template lwc:if={fileName}>
                <div class="slds-m-vertical_small">
                    <p><b>{recordsCount} row(s) loaded:</b> {fileName}</p>
                </div>
            </template>

            <!-- Preview Table -->
            <template lwc:if={columns.length}>
                <div class="slds-m-top_medium">
                    <p class="slds-m-bottom_small"><strong>Preview:</strong></p>
                    <lightning-datatable
                        key-field="id"
                        data={fileData}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

            <!-- Buttons -->
            <div class="slds-m-top_medium slds-grid">
                <lightning-button
                    label="Upload and Create Course Managers"
                    variant="brand"
                    onclick={handleUploadClick}
                    disabled={isUploadDisabled}>
                </lightning-button>
                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={resetForm}
                    class="slds-m-left_small"
                    disabled={isLoading}>
                </lightning-button>
            </div>

            <!-- Spinner -->
            <template lwc:if={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- Help Text -->
            <div class="slds-m-top_large slds-text-body_small slds-text-color_weak">
                <p><strong>Tips:</strong></p>
                <ul class="slds-list_dotted slds-m-left_medium">
                    <li>Column names are case-insensitive (e.g., "owner" or "Owner" both work)</li>
                    <li>All columns are required: Owner, Courses, CourseCode, CourseType, Location, AcademicYear, AcademicTerm, Roles</li>
                    <li>Owner must match an active Salesforce User's name</li>
                    <li>Courses must match a Learning Course name</li>
                    <li>Location must match a Location name</li>
                    <li>AcademicYear and AcademicTerm must match existing Salesforce names</li>
                    <li>Roles must be "Manager", "Associate", or "Delivery Manager"</li>
                    <li>System will create Course Managers for all matching Course Offerings</li>
                    <li>A user can only have one role per Course Offering</li>
                    <li>Only one manager per role is allowed per Course Offering</li>
                    <li>Check the messages above for details on any skipped records</li>
                </ul>
            </div>

        </div>
    </lightning-card>
</template>
