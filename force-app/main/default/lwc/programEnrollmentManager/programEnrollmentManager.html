<template>
    <div class="slds-card slds-var-p-around_medium fade-in">
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <!-- VIEW 1: PROGRAM LIST -->
        <template if:true={isProgramList}>
            <div class="slds-grid slds-grid_align-spread slds-var-m-bottom_medium">
                <div>
                    <h1 class="slds-text-heading_medium slds-var-m-bottom_medium">Program Management</h1>
                </div>
                <div class="search-container">
                    <lightning-input 
                        type="search" 
                        label="Search Programs" 
                        placeholder="Search by Name or Code..." 
                        onchange={handleSearch}
                        variant="label-hidden">
                    </lightning-input>
                </div>
            </div>

            <div class="slds-scrollable_y" style="max-height: 500px;">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered" aria-labelledby="element-with-table-label other-element-with-table-label">
                    <thead>
                        <tr class="slds-line-height_reset custom-table-header">
                            <th scope="col"><div class="slds-truncate" title="Program Name">Program Name</div></th>
                            <th scope="col"><div class="slds-truncate" title="Code">Code</div></th>
                            <th scope="col"><div class="slds-truncate" title="Type">Type</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={programs} for:item="prog">
                            <tr key={prog.Id} class="slds-hint-parent program-row" data-id={prog.Id} onclick={handleProgramSelect}>
                                <td data-label="Program Name">
                                    <div class="slds-truncate slds-text-heading_small" title={prog.Name}>{prog.Name}</div>
                                </td>
                                <td data-label="Code">
                                    <div class="slds-truncate id-text" title={prog.Program_Code__c}>{prog.Program_Code__c}</div>
                                </td>
                                <td data-label="Type">
                                    <div class="slds-truncate" title={prog.Program_Type__c}>
                                        <lightning-badge label={prog.Program_Type__c}></lightning-badge>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template if:false={programs.length}>
                    <div class="slds-text-align_center slds-var-p-around_large slds-text-color_weak">
                        No programs found.
                    </div>
                </template>
            </div>
        </template>

        <!-- VIEW 2: ENROLLMENT LIST -->
        <template if:true={isProgramDetail}>
            <div class="back-nav" onclick={handleBackToPrograms}>
                <lightning-icon icon-name="utility:chevronleft" size="x-small" class="slds-var-m-right_x-small"></lightning-icon>
                Back to Programs
            </div>

            <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center slds-var-m-bottom_medium">
                <div class="slds-var-m-right_large">
                    <h2 class="slds-text-heading_medium">{selectedProgram.Name}</h2>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-combobox
                        name="academicYear"
                        label="Filter by Academic Year"
                        placeholder="Select Year"
                        value={selectedAcademicYear}
                        options={academicYears}
                        onchange={handleYearChange}
                        variant="label-hidden"
                        dropdown-alignment="left">
                    </lightning-combobox>
                </div>
            </div>

            <div class="slds-scrollable_y" style="max-height: 500px;">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr class="slds-line-height_reset custom-table-header">
                            <th scope="col"><div class="slds-truncate" title="Student ID">Student ID</div></th>
                            <th scope="col"><div class="slds-truncate" title="Student Name">Student Name</div></th>
                            <th scope="col"><div class="slds-truncate" title="Email">Email</div></th>
                            <th scope="col"><div class="slds-truncate" title="Status">Status</div></th>
                            <th scope="col"><div class="slds-truncate" title="Sub Sub Status">Sub Sub Status</div></th>
                            <th scope="col"><div class="slds-truncate" title="Location">Location</div></th>
                            <th scope="col"><div class="slds-truncate" title="Installment 1">Installment 1</div></th>
                            <th scope="col"><div class="slds-truncate" title="Installment 2">Installment 2</div></th>
                            <th scope="col"><div class="slds-truncate" title="Installment 3">Installment 3</div></th>
                            <th scope="col"><div class="slds-truncate" title="Installment 4">Installment 4</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={enrollments} for:item="enroll">
                            <tr key={enroll.Id} class="slds-hint-parent enrollment-row" data-id={enroll.Id} onclick={handleEnrollmentClick}>
                                <td data-label="student ID">
                                    <div class="slds-truncate id-text" title={enroll.PGID}>{enroll.PGID}</div>
                                </td>
                                <td data-label="Student Name" class="slds-cell-wrap">
                                    <div class="slds-text-weight_bold" title={enroll.StudentName}>{enroll.StudentName}</div>
                                </td>
                                <td data-label="Email" class="slds-cell-wrap">
                                    <div title={enroll.Email}>{enroll.Email}</div>
                                </td>
                                <td data-label="Status">
                                    <div class="slds-truncate" title={enroll.Status}>
                                        <lightning-badge label={enroll.Status}></lightning-badge>
                                    </div>
                                </td>
                                <td data-label="Sub Sub Status">
                                    <div class="slds-truncate" title={enroll.SubSubStatus}>{enroll.SubSubStatus}</div>
                                </td>
                                <td data-label="Location">
                                    <div class="slds-truncate" title={enroll.Location}>{enroll.Location}</div>
                                </td>
                                <td data-label="Installment 1">
                                    <div class="slds-cell-wrap" title={enroll.inst1}>{enroll.inst1}</div>
                                </td>
                                <td data-label="Installment 2">
                                    <div class="slds-cell-wrap" title={enroll.inst2}>{enroll.inst2}</div>
                                </td>
                                <td data-label="Installment 3">
                                    <div class="slds-cell-wrap" title={enroll.inst3}>{enroll.inst3}</div>
                                </td>
                                <td data-label="Installment 4">
                                    <div class="slds-cell-wrap" title={enroll.inst4}>{enroll.inst4}</div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template if:false={enrollments.length}>
                    <div class="slds-text-align_center slds-var-p-around_large slds-text-color_weak">
                        No enrollments found for this selection.
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- MODAL: ENROLLMENT DRILL-DOWN -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header modal-header-custom">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{selectedEnrollment.StudentName} - Details</h2>
                    <p class="slds-text-color_weak slds-var-m-top_x-small">{selectedEnrollment.AcademicYear} | {selectedEnrollment.Status}</p>
                </header>
                
                <div class="slds-modal__content slds-var-p-around_medium" style="min-height: 400px;">
                    

                        
                        <lightning-tabset>
                        <!-- Tab 2: Installments -->
                        <lightning-tab label="ISB Installments">
                            <div class="slds-scrollable_y" style="max-height: 300px;">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col">Number</th>
                                            <th scope="col">Status</th>
                                            <th scope="col">Due Date</th>
                                            <th scope="col">Total</th>
                                            <th scope="col">Paid</th>
                                            <th scope="col">Pending</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={enrollmentInstallments} for:item="inst">
                                            <tr key={inst.Id}>
                                                <td>{inst.Installment_Number__c}</td>
                                                <td><lightning-badge label={inst.Installment_Status__c}></lightning-badge></td>
                                                <td><lightning-formatted-date-time value={inst.Due_Date__c}></lightning-formatted-date-time></td>
                                                <td><lightning-formatted-number value={inst.Total_Amount_calc__c} format-style="currency" currency-code="INR"></lightning-formatted-number></td>
                                                <td><lightning-formatted-number value={inst.Paid_Amount__c} format-style="currency" currency-code="INR"></lightning-formatted-number></td>
                                                <td><lightning-formatted-number value={inst.Pending_Amount__c} format-style="currency" currency-code="INR"></lightning-formatted-number></td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <template if:false={enrollmentInstallments.length}>
                                    <p class="slds-text-align_center slds-var-p-around_medium slds-text-color_weak">No installments found.</p>
                                </template>
                            </div>
                        </lightning-tab>
                        <!-- Tab 1: Sessions -->
                        <lightning-tab label="Enrollment Sessions">
                            <div class="slds-scrollable_y" style="max-height: 300px;">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col">Session</th>
                                            <th scope="col">Status</th>
                                            <th scope="col">Attendance</th>
                                            <th scope="col">GPA</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={enrollmentSessions} for:item="session">
                                            <tr key={session.Id}>
                                                <td>{session.Academic_Session__r.Name}</td>
                                                <td><lightning-badge label={session.Status__c}></lightning-badge></td>
                                                <td>{session.Attendance__c}%</td>
                                                <td>{session.GPA__c}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <template if:false={enrollmentSessions.length}>
                                    <p class="slds-text-align_center slds-var-p-around_medium slds-text-color_weak">No sessions found.</p>
                                </template>
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
