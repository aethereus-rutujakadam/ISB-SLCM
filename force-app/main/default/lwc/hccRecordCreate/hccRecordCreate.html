<template>
    <div class="hcc-form-wrapper">

        <!-- Save spinner overlay -->
        <template if:true={isLoading}>
            <div class="loading-overlay">
                <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
            </div>
        </template>

        <lightning-card title="New Record: Honour Code Committee" icon-name="custom:custom15">
            <div class="slds-p-around_medium form-body">

                <!-- Error banner -->
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        {errorMessage}
                    </div>
                </template>

                <!-- SECTION: Student Information                            -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Student Information</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>

                            <!-- PGID -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input
                                    label="Student PGID"
                                    required
                                    value={pgid}
                                    onchange={handlePgidChange}
                                    onblur={handlePgidBlur}
                                    placeholder="Enter student PGID">
                                </lightning-input>
                                <template if:true={pgidLookupLoading}>
                                    <div class="pgid-loading">
                                        <lightning-spinner size="x-small" alternative-text="Looking up student..."></lightning-spinner>
                                        <span class="pgid-loading-text">Looking up student...</span>
                                    </div>
                                </template>
                            </lightning-layout-item>

                            <!-- Program (readonly) -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Program" value={programName} disabled></lightning-input>
                            </lightning-layout-item>

                            <!-- Academic Year (readonly) -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Academic Year" value={academicYearName} disabled></lightning-input>
                            </lightning-layout-item>

                            <!-- Current Reporting Location (readonly) -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Current Reporting Location" value={currentReportingLocationName} disabled></lightning-input>
                            </lightning-layout-item>

                            <!-- Student Name -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <template if:true={isStudentNameLocked}>
                                    <lightning-input label="Student Name" value={studentName} disabled></lightning-input>
                                </template>
                                <template if:false={isStudentNameLocked}>
                                    <lightning-input label="Student Name" value={studentName} onchange={handleStudentNameChange}></lightning-input>
                                </template>
                            </lightning-layout-item>

                            <!-- Student Email -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <template if:true={isStudentEmailLocked}>
                                    <lightning-input label="Student Email" value={studentEmail} disabled></lightning-input>
                                </template>
                                <template if:false={isStudentEmailLocked}>
                                    <lightning-input label="Student Email" value={studentEmail} onchange={handleStudentEmailChange}></lightning-input>
                                </template>
                            </lightning-layout-item>

                            <!-- Student Mobile -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <template if:true={isStudentMobileLocked}>
                                    <lightning-input label="Student Mobile" value={studentMobile} disabled></lightning-input>
                                </template>
                                <template if:false={isStudentMobileLocked}>
                                    <lightning-input label="Student Mobile" value={studentMobile} onchange={handleStudentMobileChange}></lightning-input>
                                </template>
                            </lightning-layout-item>

                            <!-- Previous Violation Found Guilty Date -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Previous Violation Found Guilty Date"
                                    value={previousViolationFoundGuiltyDate}
                                    disabled>
                                </lightning-input>
                            </lightning-layout-item>

                            <!-- Academic Session Lookup -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <div class="slds-form-element lookup-container">
                                    <label class="slds-form-element__label">Academic Session</label>
                                    <template if:true={academicSessionId}>
                                        <div class="lookup-pill-container">
                                            <span class="lookup-pill">
                                                <span class="lookup-pill-label">{academicSessionName}</span>
                                                <button class="lookup-pill-remove" onmousedown={handleAcademicSessionClear} title="Remove">&#10005;</button>
                                            </span>
                                        </div>
                                    </template>
                                    <template if:false={academicSessionId}>
                                        <input type="text" class="slds-input" value={academicSessionSearchTerm}
                                            placeholder="Search Academic Session..."
                                            onkeyup={handleAcademicSessionKeyUp}
                                            onfocus={handleAcademicSessionFocus}
                                            onblur={handleAcademicSessionBlur} />
                                        <template if:true={showAcademicSessionDropdown}>
                                            <div class="lookup-dropdown">
                                                <template if:true={academicSessionLoading}>
                                                    <div class="lookup-spinner-wrap">
                                                        <lightning-spinner size="small" alternative-text="Searching..."></lightning-spinner>
                                                    </div>
                                                </template>
                                                <template if:false={academicSessionLoading}>
                                                    <template if:true={hasAcademicSessionOptions}>
                                                        <template for:each={academicSessionOptions} for:item="opt">
                                                            <div key={opt.id} class="lookup-option"
                                                                data-id={opt.id} data-name={opt.name}
                                                                onmousedown={handleAcademicSessionSelect}>{opt.name}</div>
                                                        </template>
                                                    </template>
                                                    <template if:false={hasAcademicSessionOptions}>
                                                        <div class="lookup-no-results">No results found</div>
                                                    </template>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </lightning-layout-item>

                            <!-- Course Offering Lookup -->
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <div class="slds-form-element lookup-container">
                                    <label class="slds-form-element__label">Course</label>
                                    <template if:true={courseOfferingId}>
                                        <div class="lookup-pill-container">
                                            <span class="lookup-pill">
                                                <span class="lookup-pill-label">{courseOfferingName}</span>
                                                <button class="lookup-pill-remove" onmousedown={handleCourseOfferingClear} title="Remove">&#10005;</button>
                                            </span>
                                        </div>
                                    </template>
                                    <template if:false={courseOfferingId}>
                                        <input type="text" class="slds-input" value={courseOfferingSearchTerm}
                                            placeholder="Search Course..."
                                            onkeyup={handleCourseOfferingKeyUp}
                                            onfocus={handleCourseOfferingFocus}
                                            onblur={handleCourseOfferingBlur} />
                                        <template if:true={showCourseOfferingDropdown}>
                                            <div class="lookup-dropdown">
                                                <template if:true={courseOfferingLoading}>
                                                    <div class="lookup-spinner-wrap">
                                                        <lightning-spinner size="small" alternative-text="Searching..."></lightning-spinner>
                                                    </div>
                                                </template>
                                                <template if:false={courseOfferingLoading}>
                                                    <template if:true={hasCourseOfferingOptions}>
                                                        <template for:each={courseOfferingOptions} for:item="opt">
                                                            <div key={opt.id} class="lookup-option"
                                                                data-id={opt.id} data-name={opt.name}
                                                                onmousedown={handleCourseOfferingSelect}>{opt.name}</div>
                                                        </template>
                                                    </template>
                                                    <template if:false={hasCourseOfferingOptions}>
                                                        <div class="lookup-no-results">No results found</div>
                                                    </template>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </lightning-layout-item>

                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Case Initiation                               -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Case Initiation</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <div class="slds-form-element lookup-container">
                                    <label class="slds-form-element__label">Reported Faculty</label>
                                    <template if:true={reportedFacultyId}>
                                        <div class="lookup-pill-container">
                                            <span class="lookup-pill">
                                                <span class="lookup-pill-label">{reportedFacultyName}</span>
                                                <button class="lookup-pill-remove" onmousedown={handleReportedFacultyClear} title="Remove">&#10005;</button>
                                            </span>
                                        </div>
                                    </template>
                                    <template if:false={reportedFacultyId}>
                                        <input type="text" class="slds-input" value={reportedFacultySearchTerm}
                                            placeholder="Search Reported Faculty..."
                                            disabled={isReportedFacultyLookupDisabled}
                                            onkeyup={handleReportedFacultyKeyUp}
                                            onfocus={handleReportedFacultyFocus}
                                            onblur={handleReportedFacultyBlur} />
                                        <template if:true={showReportedFacultyDropdown}>
                                            <div class="lookup-dropdown">
                                                <template if:true={reportedFacultyLoading}>
                                                    <div class="lookup-spinner-wrap">
                                                        <lightning-spinner size="small" alternative-text="Searching..."></lightning-spinner>
                                                    </div>
                                                </template>
                                                <template if:false={reportedFacultyLoading}>
                                                    <template if:true={hasReportedFacultyOptions}>
                                                        <template for:each={reportedFacultyOptions} for:item="opt">
                                                            <div key={opt.id} class="lookup-option"
                                                                data-id={opt.id} data-name={opt.name}
                                                                onmousedown={handleReportedFacultySelect}>{opt.label}</div>
                                                        </template>
                                                    </template>
                                                    <template if:false={hasReportedFacultyOptions}>
                                                        <div class="lookup-no-results">No faculty found for selected course</div>
                                                    </template>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Case Reported Date" value={caseReportedDate} onchange={handleCaseReportedDateChange}></lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Submission Date" value={submissionDate} onchange={handleSubmissionDateChange}></lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Violation Type" value={violationType} options={violationTypeOptions} onchange={handleViolationTypeChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Component Name" value={componentName} onchange={handleComponentNameChange}></lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="number" label="Turnitin Similarity (%)" value={turnitinSimilarity} onchange={handleTurnitinSimilarityChange} step="0.01"></lightning-input>
                            </lightning-layout-item>

                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Initial Evidence" value={initialEvidence} onchange={handleInitialEvidenceChange}></lightning-input>
                            </lightning-layout-item>

                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Initial Review                                 -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Initial Review</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="HCC Chair ISB Email" type="email"
                                    value={hccChairISBEmail}
                                    onchange={handleHccChairISBEmailChange}
                                    onblur={handleHccChairISBEmailBlur}
                                    field-level-help="Enter the HCC Chair's email address. The Chair contact will be auto-populated if a matching Faculty record is found.">
                                </lightning-input>
                                <template if:true={chairLookupLoading}>
                                    <div class="chair-lookup-status">
                                        <lightning-spinner size="x-small" alternative-text="Looking up contact..."></lightning-spinner>
                                        <span class="chair-lookup-text">Looking up contact...</span>
                                    </div>
                                </template>
                                <template if:true={chairContactName}>
                                    <div class="chair-contact-found">
                                        <lightning-icon icon-name="utility:user" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                        <span>{chairContactName}</span>
                                    </div>
                                </template>
                                <template if:true={chairNoContactFound}>
                                    <p class="chair-no-contact">No contact found for this email.</p>
                                </template>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Chair Decision" value={chairDecision} options={chairDecisionOptions} onchange={handleChairDecisionChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="12" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Decision Reason" value={decisionReason} onchange={handleDecisionReasonChange}></lightning-textarea>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Student Communication                          -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Student Communication</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Response Deadline" value={responseDeadline} onchange={handleResponseDeadlineChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Response To Charges" value={responseToCharges} options={responseToChargesOptions} onchange={handleResponseToChargesChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Statement Request Date" value={statementRequestDate} onchange={handleStatementRequestDateChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Outcome Email Date" value={outcomeEmailDate} onchange={handleOutcomeEmailDateChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Committee Preparation                          -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Committee Preparation</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="datetime-local" label="Hearing Date" value={hearingDate} onchange={handleHearingDateChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Convener Email" value={convenerEmail} onchange={handleConvenerEmailChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Email IDs Faculty Members" value={emailIdsFacultyMembers} onchange={handleEmailIdsFacultyMembersChange}></lightning-textarea>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Email IDs Student Members" value={emailIdsStudentMembers} onchange={handleEmailIdsStudentMembersChange}></lightning-textarea>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="checkbox" label="Email Sent to Committee" checked={emailSentToCommittee} onchange={handleEmailSentToCommitteeChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Hearing                                        -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Hearing</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Hearing Status" value={hearingStatus} options={hearingStatusOptions} onchange={handleHearingStatusChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Recording URL" value={recordingUrl} onchange={handleRecordingUrlChange} field-level-help="This is a URL field, Please insert URL link to Recording"></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="12" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Hearing Attendance" value={hearingAttendance} onchange={handleHearingAttendanceChange}></lightning-textarea>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Committee Decision                             -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Committee Decision</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Vote Result" value={voteResult} onchange={handleVoteResultChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Committee Decision" value={committeeDecision} options={committeeDecisionOptions} onchange={handleCommitteeDecisionChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Penalty Type" value={penaltyType} options={penaltyTypeOptionList} onchange={handlePenaltyTypeChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Penalty Details" value={penaltyDetails} onchange={handlePenaltyDetailsChange}></lightning-textarea>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Communication                                  -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Communication</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Decision Notification Date to Student"
                                    value={decisionNotificationDateToStudent}
                                    onchange={handleDecisionNotificationDateToStudentChange}>
                                </lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Final Communication Outcome" value={finalCommunicationOutcome} options={finalCommOutcomeOptions} onchange={handleFinalCommunicationOutcomeChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Appeal (Dean)                                  -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Appeal (Dean)</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Dean Appeal Date" value={deanAppealDate} onchange={handleDeanAppealDateChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Dean Appeal Grounds" value={deanAppealGrounds} options={deanAppealGroundsOptions} onchange={handleDeanAppealGroundsChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-combobox label="Dean Decision" value={deanDecision} options={deanDecisionOptions} onchange={handleDeanDecisionChange} placeholder="--None--"></lightning-combobox>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Final Penalty" value={finalPenalty} onchange={handleFinalPenaltyChange}></lightning-textarea>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="12" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-textarea label="Appeal Remarks" value={appealRemarks} onchange={handleAppealRemarksChange}></lightning-textarea>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- SECTION: Closure                                        -->
                <div class="hcc-section">
                    <div class="hcc-section-header">
                        <h2 class="hcc-section-title">Closure</h2>
                    </div>
                    <div class="hcc-section-content">
                        <lightning-layout multiple-rows>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="date" label="Case Closed Date" value={caseClosedDate} onchange={handleCaseClosedDateChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input label="Course Penalty" value={coursePenalty} onchange={handleCoursePenaltyChange}></lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item size="12" medium-device-size="6" class="slds-p-horizontal_small slds-p-bottom_small">
                                <lightning-input type="checkbox" label="Penalty Enforced" checked={penaltyEnforced} onchange={handlePenaltyEnforcedChange}></lightning-input>
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <lightning-button label="Cancel" onclick={handleCancel} disabled={isLoading}></lightning-button>
                    <lightning-button variant="brand" label="Save" onclick={handleSave} disabled={isLoading}></lightning-button>
                </div>

            </div>
        </lightning-card>
    </div>
</template>
