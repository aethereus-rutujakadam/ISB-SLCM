<template>
    <lightning-card title="Education History" icon-name="standard:education">
        <div class="slds-p-around_medium">

            <!-- Records with SLDS Font Hierarchy -->
            <template if:true={hasRecords}>
                <template for:each={records} for:item="edu">
                    <div key={edu.Id} class="slds-box slds-m-bottom_large slds-theme_default">
                        
                        <!-- Primary Title: Institute (Highest Hierarchy) -->
                        <div class="slds-text-heading_medium slds-m-bottom_xx-small slds-text-title_bold">
                            {edu.title}
                        </div>

                        <!-- Secondary Title: Degree
                        <div class="slds-text-heading_small slds-m-bottom_small slds-text-color_weak">
                            {edu.subtitle}
                        </div> -->

                        <!-- Detailed Information Grid -->
                        <div class="slds-grid slds-wrap slds-p-top_small slds-border_top">
                            <!-- Dedicated row for Start Date and End Date - ensures they're parallel -->
                            <template if:true={edu.startDateField}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_xx-small">
                                    <div class="slds-grid">
                                        <div class="slds-col slds-size_1-of-3 slds-text-title_bold slds-text-color_weak">
                                            {edu.startDateField.label}
                                        </div>
                                        <div class="slds-col slds-size_2-of-3 slds-text-body_small">
                                            {edu.startDateField.value}
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template if:true={edu.endDateField}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_xx-small">
                                    <div class="slds-grid">
                                        <div class="slds-col slds-size_1-of-3 slds-text-title_bold slds-text-color_weak">
                                            {edu.endDateField.label}
                                        </div>
                                        <div class="slds-col slds-size_2-of-3 slds-text-body_small">
                                            {edu.endDateField.value}
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <!-- Rest of the fields -->
                            <template for:each={edu.details} for:item="field">
                                <div key={field.id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_xx-small">
                                    <div class="slds-grid">
                                        <div class="slds-col slds-size_1-of-3 slds-text-title_bold slds-text-color_weak">
                                            {field.label}
                                        </div>
                                        <div class="slds-col slds-size_2-of-3 slds-text-body_small">
                                            {field.value}
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>

                    </div>
                </template>
            </template>

            <!-- Error State -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                    <h2>{error}</h2>
                </div>
            </template>

            <!-- Empty State -->
            <template if:false={hasRecords}>
                <template if:false={error}>
                    <div class="slds-text-align_center slds-p-vertical_medium">
                        <p class="slds-text-color_weak">No education history found.</p>
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
