<template>
    <lightning-card title="My Installments & Payments" icon-name="custom:custom63">
        
        <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>
            
            <!-- SECTION 1: MY INSTALLMENTS -->
            <lightning-accordion-section name="installments" label="My Installments">
                
                <!-- Loading Spinner -->
                <template if:true={isLoadingInstallments}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading installments..." size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Error Message -->
                <template if:true={installmentsError}>
                    <div class="slds-m-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <h2>
                                <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                    class="slds-m-right_x-small"></lightning-icon>
                                Error loading installments
                            </h2>
                            <p class="slds-m-top_x-small">{installmentsError}</p>
                        </div>
                    </div>
                </template>

                <!-- Installments Table -->
                <template if:true={hasInstallments}>
                    <div class="slds-m-around_medium">
                        <div class="installment-table-container">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered installment-table">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 25%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Installment Name">
                                                <strong>Installment Name</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 12%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Due Date">
                                                <strong>Due Date</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 12%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Amount">
                                                <strong>Amount</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 10%; text-align: center;">
                                            <div class="slds-truncate slds-text-title_caps" title="Installment Number">
                                                <strong>Installment #</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 13%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Program Name">
                                                <strong>Program</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 28%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Actions">
                                                <strong>Actions</strong>
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={installments} for:item="record">
                                        <tr key={record.Id} class="installment-row">
                                            <!-- Installment Name with Fee Breakage Link -->
                                            <td role="gridcell">
                                                <div class="slds-media slds-media_center">
                                                    <div class="slds-media__figure">
                                                        <lightning-icon icon-name="standard:account" size="small">
                                                        </lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <div class="slds-text-body_regular" title={record.Name}>
                                                            <strong>{record.Name}</strong>
                                                        </div>
                                                        <a href="#" class="slds-text-link_reset fee-breakage-link"
                                                            data-record-id={record.Id} onclick={handleViewFeeBreakage}>
                                                            <lightning-icon icon-name="utility:info" size="xx-small"
                                                                class="slds-m-right_xx-small"></lightning-icon>
                                                            View Fee Breakage
                                                        </a>
                                                    </div>
                                                </div>
                                            </td>

                                            <!-- Due Date -->
                                            <td role="gridcell">
                                                <template if:true={record.Due_Date__c}>
                                                    <div class="due-date-cell">
                                                        <lightning-icon icon-name="utility:event" size="xx-small"
                                                            class="slds-m-right_xx-small date-icon"></lightning-icon>
                                                        <lightning-formatted-date-time value={record.Due_Date__c} year="numeric"
                                                            month="short" day="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </div>
                                                </template>
                                                <template if:false={record.Due_Date__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Amount -->
                                            <td role="gridcell">
                                                <template if:true={record.Total_Amount_calc__c}>
                                                    <div class="amount-cell">
                                                        <lightning-formatted-number value={record.Total_Amount_calc__c}
                                                            format-style="currency" currency-code="INR"
                                                            minimum-fraction-digits="2">
                                                        </lightning-formatted-number>
                                                    </div>
                                                </template>
                                                <template if:false={record.Total_Amount_calc__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Installment Number -->
                                            <td role="gridcell" style="text-align: center;">
                                                <template if:true={record.Installment_Number__c}>
                                                    <span class="installment-badge">
                                                        {record.Installment_Number__c}
                                                    </span>
                                                </template>
                                                <template if:false={record.Installment_Number__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Program Name -->
                                            <td role="gridcell">
                                                <template if:true={record.programName}>
                                                    <lightning-badge label={record.programName} class="program-badge">
                                                    </lightning-badge>
                                                </template>
                                                <template if:false={record.programName}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Actions Column -->
                                            <td role="gridcell" style="padding: 0.75rem 1rem;">
                                                <!-- PAID Status -->
                                                <template if:true={record.isPaid}>
                                                    <div class="action-container paid-container">
                                                        <div class="status-badge-container">
                                                            <lightning-icon icon-name="utility:success" size="x-small"
                                                                variant="success" class="slds-m-right_xx-small">
                                                            </lightning-icon>
                                                            <span class="status-text-paid">Paid</span>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- Under Verification Status -->
                                                <template if:true={record.isUnderVerification}>
                                                    <div class="action-container verification-container">
                                                        <div class="status-badge-container">
                                                            <lightning-icon icon-name="utility:clock" size="x-small"
                                                                variant="warning" class="slds-m-right_xx-small">
                                                            </lightning-icon>
                                                            <span class="status-text-verification">Payment under verification</span>
                                                        </div>
                                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                            Verification may take 1-2 business days
                                                        </p>
                                                    </div>
                                                </template>

                                                <!-- NOT PAID Status -->
                                                <template if:false={record.isPaid}>
                                                    <!-- Can Pay Now -->
                                                    <template if:true={record.canPayNow}>
                                                        <div class="pay-now-row">
                                                            <c-payment record-id={record.Id} onpaymentsuccess={handlePaymentSuccess}></c-payment>

                                                            <template if:true={record.isOverdue}>
                                                                <div class="overdue-alert">
                                                                    <lightning-icon icon-name="utility:warning" size="x-small"
                                                                        variant="warning" class="slds-m-right_xx-small">
                                                                    </lightning-icon>
                                                                    <span class="overdue-text">
                                                                        Payment Overdue - Due: {record.formattedDueDate}
                                                                    </span>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Payment Not Yet Available -->
                                                    <template if:true={record.isPaymentNotYetAvailable}>
                                                        <div class="info-message">
                                                            <lightning-icon icon-name="utility:info" size="x-small"
                                                                class="slds-m-right_xx-small info-icon">
                                                            </lightning-icon>
                                                            <span class="info-text">
                                                                Payment available from <strong>{record.paymentAvailableFromDate}</strong>
                                                            </span>
                                                        </div>
                                                    </template>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <!-- Total Count -->
                        <div class="slds-m-top_medium slds-p-horizontal_medium">
                            <p class="slds-text-body_small slds-text-color_weak">
                                <lightning-icon icon-name="utility:layers" size="xx-small" class="slds-m-right_xx-small">
                                </lightning-icon>
                                Showing {totalInstallments} installment{pluralSuffixInstallments}
                            </p>
                        </div>
                    </div>
                </template>

                <!-- Empty State for Installments -->
                <template if:false={hasInstallments}>
                    <template if:false={isLoadingInstallments}>
                        <template if:false={installmentsError}>
                            <div class="slds-align_absolute-center slds-p-around_xx-large">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="custom:custom63" size="large"
                                        class="slds-m-bottom_medium empty-state-icon">
                                    </lightning-icon>
                                    <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No Installments Available</h3>
                                    <p class="slds-text-body_regular slds-text-color_weak">
                                        You don't have any installments at this time.
                                    </p>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

            </lightning-accordion-section>

            <!-- SECTION 2: MY PAYMENTS -->
            <lightning-accordion-section name="payments" label="My Payments">
                
                <!-- Loading Spinner -->
                <template if:true={isLoadingPayments}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading payments..." size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Error Message -->
                <template if:true={paymentsError}>
                    <div class="slds-m-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <h2>
                                <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                    class="slds-m-right_x-small"></lightning-icon>
                                Error loading payments
                            </h2>
                            <p class="slds-m-top_x-small">{paymentsError}</p>
                        </div>
                    </div>
                </template>

                <!-- Payments Table -->
                <template if:true={hasPayments}>
                    <div class="slds-m-around_medium">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered payment-table">
                            <thead>
                                <tr>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Payment</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Payment Type</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Date</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Amount</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Mode</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Status</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Action</strong>
                                        </div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={payments} for:item="p">
                                    <tr key={p.Id}>
                                        <td><strong>{p.Name}</strong></td>
                                        <td>{p.paymentType}</td>
                                        <td>{p.paymentDate}</td>
                                        <td>{p.formattedAmount}</td>
                                        <td>{p.Payment_Mode__c}</td>
                                        <td>
                                            <span class={p.statusClass}>
                                                {p.Initiated__c}
                                            </span>
                                        </td>
                                        <td>
                                            <template if:true={p.isSuccess}>
                                                <lightning-button
                                                    label="Download Invoice"
                                                    icon-name="utility:download"
                                                    data-id={p.Id}
                                                    onclick={handleDownloadInvoice}
                                                    variant="brand-outline">
                                                </lightning-button>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Total Count -->
                        <div class="slds-m-top_medium">
                            <p class="slds-text-body_small slds-text-color_weak">
                                <lightning-icon icon-name="utility:layers" size="xx-small" class="slds-m-right_xx-small">
                                </lightning-icon>
                                Showing {totalPayments} payment{pluralSuffixPayments}
                            </p>
                        </div>
                    </div>
                </template>

                <!-- Empty State for Payments -->
                <template if:false={hasPayments}>
                    <template if:false={isLoadingPayments}>
                        <template if:false={paymentsError}>
                            <div class="slds-align_absolute-center slds-p-around_xx-large">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="custom:custom63" size="large"
                                        class="slds-m-bottom_medium empty-state-icon">
                                    </lightning-icon>
                                    <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No Payments Available</h3>
                                    <p class="slds-text-body_regular slds-text-color_weak">
                                        You don't have any payments at this time.
                                    </p>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

            </lightning-accordion-section>

        </lightning-accordion>

    </lightning-card>

    <!-- Fee Breakage Modal -->
    <template if:true={isFeeBreakageModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 600px;">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeFeeBreakageModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Fee Breakage Details</h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Loading State -->
                    <template if:true={isLoadingBreakage}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Fee Breakdown -->
                    <template if:false={isLoadingBreakage}>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-border_top slds-border_bottom slds-p-around_small">
                                <template for:each={selectedFeeBreakdown} for:item="item">
                                    <div key={item.feeType}
                                        class="slds-grid slds-grid_align-spread slds-text-body_regular slds-m-vertical_x-small">
                                        <span class="slds-col slds-text-color_weak">{item.feeType}</span>
                                        <span class="slds-col slds-text-align_right"><strong>₹{item.amount}</strong></span>
                                    </div>
                                </template>

                                <div
                                    class="slds-grid slds-grid_align-spread slds-text-title slds-m-top_small slds-border_top slds-p-top_small">
                                    <span class="slds-col"><strong>Total Installment:</strong></span>
                                    <span class="slds-col slds-text-align_right"><strong>₹{selectedTotalAmount}</strong></span>
                                </div>
                            </div>

                            <p class="slds-text-body_small slds-m-top_small" style="color: #c90000;">
                                * Transaction charges are extra and borne by the payer.
                            </p>
                        </div>
                    </template>
                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Close" onclick={closeFeeBreakageModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
