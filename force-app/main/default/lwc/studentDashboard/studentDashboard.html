<template>
    <div class="dashboard-container">
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_xx-large">
                <lightning-spinner alternative-text="Loading dashboard..." size="large"></lightning-spinner>
            </div>
        </template>

        <!-- Dashboard Content -->
        <template if:false={isLoading}>
            <!-- Welcome Header -->
            <div class="welcome-header">
                <h1 class="welcome-title">Welcome, {studentName}!</h1>
                <p class="welcome-subtitle">Here's your academic snapshot at a glance.</p>
            </div>

            <!-- Dashboard Cards Grid -->
            <div class="dashboard-grid">
                <!-- Profile Basics Card -->
                <div class="dashboard-card card-purple" onclick={navigateToProfile} data-card="profile">
                    <div class="card-header">
                        <lightning-icon icon-name="utility:user" size="small" class="card-icon"></lightning-icon>
                        <h3 class="card-title">Profile Basics</h3>
                    </div>
                    <div class="card-content">
                        <p class="card-text"><strong>Name:</strong> {profileData.name}</p>
                        <p class="card-text"><strong>Email:</strong> {profileData.email}</p>
                        <p class="card-text"><strong>Mobile Phone:</strong> {profileData.phone}</p>
                    </div>
                    <div class="card-navigation">
                        <lightning-icon icon-name="utility:chevronright" size="xx-small" class="nav-icon"></lightning-icon>
                    </div>
                </div>

                <!-- My Program Enrollments Card (always visible) -->
                <div class="dashboard-card card-navy" onclick={navigateToProgram} data-card="program">
                    <div class="card-header">
                        <lightning-icon icon-name="utility:education" size="small" class="card-icon"></lightning-icon>
                        <h3 class="card-title">My Program Enrollments</h3>
                    </div>
                    <div class="card-content">
                        <p class="card-text"><strong>Program:</strong> {programData.name}</p>
                        <template if:true={programData.primaryAdvisor}>
                            <p class="card-text"><strong>Primary Advisor:</strong> {programData.primaryAdvisor}</p>
                        </template>
                        <p class="card-text">
                            <lightning-badge label={programData.status} class="status-badge"></lightning-badge>
                        </p>
                    </div>
                    <div class="card-navigation">
                        <lightning-icon icon-name="utility:chevronright" size="xx-small" class="nav-icon"></lightning-icon>
                    </div>
                </div>

                <template if:false={isPgpylStudent}>
                    <!-- Attendance Summary Card -->
                    <div class="dashboard-card card-gradient-teal" onclick={openAttendanceModal} data-card="attendance">
                        <div class="card-header">
                            <lightning-icon icon-name="utility:date_time" size="small" class="card-icon"></lightning-icon>
                            <h3 class="card-title">Attendance Summary</h3>
                        </div>
                        <div class="card-content">
                            <div class="attendance-circle" style={attendancePercentageStyle}>
                                <p class="attendance-percentage">{attendanceData.percentage}%</p>
                            </div>
                            <p class="card-text">Overall Attendance</p>
                            <p class="card-text-small">{attendanceData.totalAttended}/{attendanceData.totalScheduled} Classes</p>
                            <p class="card-text-small">Last Updated: {attendanceData.lastUpdated}</p>
                        </div>
                        <div class="card-navigation">
                            <lightning-icon icon-name="utility:chevronright" size="xx-small" class="nav-icon"></lightning-icon>
                        </div>
                    </div>

                    <!-- Open Tasks Card -->
                    <div class="dashboard-card card-navy" onclick={navigateToTasks} data-card="tasks">
                        <div class="card-header">
                            <lightning-icon icon-name="utility:task" size="small" class="card-icon"></lightning-icon>
                            <h3 class="card-title">Open Tasks</h3>
                        </div>
                        <div class="card-content">
                            <div class="count-circle">
                                <p class="count-number">{tasksData.openCount}</p>
                            </div>
                            <p class="card-text">Tasks Assigned to You</p>
                        </div>
                        <div class="card-navigation">
                            <lightning-icon icon-name="utility:chevronright" size="xx-small" class="nav-icon"></lightning-icon>
                        </div>
                    </div>

                    <!-- Open Cases Card -->
                    <div class="dashboard-card card-teal" onclick={navigateToCases} data-card="cases">
                        <div class="card-header">
                            <lightning-icon icon-name="utility:case" size="small" class="card-icon"></lightning-icon>
                            <h3 class="card-title">Open Cases</h3>
                        </div>
                        <div class="card-content">
                            <div class="count-circle">
                                <p class="count-number">{casesData.openCount}</p>
                            </div>
                            <template if:true={casesData.recentSubject}>
                                <p class="card-text-small">Recent: {casesData.recentSubject}</p>
                            </template>
                        </div>
                        <div class="card-navigation">
                            <lightning-icon icon-name="utility:chevronright" size="xx-small" class="nav-icon"></lightning-icon>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={error}>
            <div class="slds-text-align_center slds-p-around_large">
                <lightning-icon icon-name="utility:error" size="large" variant="error"></lightning-icon>
                <p class="slds-text-heading_medium slds-m-top_medium">Error Loading Dashboard</p>
                <p class="slds-text-body_regular slds-m-top_small">{error}</p>
            </div>
        </template>

        <!-- Attendance Detail Modal -->
        <template if:false={isPgpylStudent}>
        <template if:true={showAttendanceModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container attendance-modal-container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header modal-header-custom">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                                title="Close" onclick={closeAttendanceModal}>
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="close"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Course-wise Attendance</h2>
                        <p class="modal-subtitle">Current & Previous Terms</p>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content modal-content-custom">
                        <template if:true={isLoadingAttendance}>
                            <div class="slds-align_absolute-center slds-p-around_large">
                                <lightning-spinner alternative-text="Loading attendance..." size="medium"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={isLoadingAttendance}>
                            <!-- Overall Summary -->
                            <template if:true={attendanceSummary}>
                                <div class="summary-banner">
                                    <div class="summary-item">
                                        <div class="summary-label">Total Courses</div>
                                        <div class="summary-value">{attendanceSummary.totalCourses}</div>
                                    </div>
                                    <div class="summary-item">
                                        <div class="summary-label">Classes Attended</div>
                                        <div class="summary-value">{attendanceSummary.attendanceRatio}</div>
                                    </div>
                                    <div class="summary-item summary-item-highlight">
                                        <div class="summary-label">Overall Percentage</div>
                                        <div class="summary-value">{attendanceSummary.overallPercentage}%</div>
                                    </div>
                                </div>
                            </template>

                            <!-- Attendance Records by Term -->
                            <template if:true={hasAttendanceRecords}>
                                <template for:each={groupedByTerm} for:item="termGroup">
                                    <div key={termGroup.termName} class="term-group">
                                        <div class="term-header">
                                            <h3 class="term-title">{termGroup.termName}</h3>
                                            <span class="term-count">{termGroup.courses.length} courses</span>
                                        </div>
                                        
                                        <div class="course-list">
                                            <template for:each={termGroup.courses} for:item="course">
                                                <div key={course.id} class="course-item">
                                                    <div class="course-info">
                                                        <div class="course-name">{course.courseName}</div>
                                                        <div class="course-details">
                                                            <span class="attendance-ratio">{course.attendanceRatio}</span>
                                                            <span class="detail-separator">•</span>
                                                            <span class="last-updated">Last: {course.lastAttendanceDate}</span>
                                                        </div>
                                                    </div>
                                                    <div class="course-status">
                                                        <div class={course.statusClass} style={course.dynamicStyle}>
                                                            <span class="status-percentage">{course.percentage}%</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </template>

                            <template if:false={hasAttendanceRecords}>
                                <div class="empty-state">
                                    <lightning-icon icon-name="utility:info" size="medium" class="empty-icon"></lightning-icon>
                                    <p class="empty-text">No attendance records found.</p>
                                </div>
                            </template>
                        </template>
                    </div>

                   <!-- Modal Footer -->
                    <footer class="slds-modal__footer modal-footer-custom">
                        <button class="slds-button slds-button_neutral" onclick={navigateToAllAttendances}>
                            View All Attendances
                        </button>
                        <button class="slds-button slds-button_brand" onclick={closeAttendanceModal}>Close</button>
                    </footer>       
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        </template>
    </div>
</template>
