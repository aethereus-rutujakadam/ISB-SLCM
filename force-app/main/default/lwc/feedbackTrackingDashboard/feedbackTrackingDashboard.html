<template>
    <div class="slds-p-around_medium">
        <!-- Statistics Cards -->
        <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_large">
            <!-- Total Triggered -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
                <div class="slds-box slds-box_small stat-card">
                    <div class="slds-text-title_caps slds-text-color_weak">Total Triggered</div>
                    <div class="slds-text-heading_large stat-number">{stats.totalTriggered}</div>
                </div>
            </div>

            <!-- Submitted -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
                <div class="slds-box slds-box_small stat-card stat-success">
                    <div class="slds-text-title_caps slds-text-color_weak">Submitted</div>
                    <div class="slds-text-heading_large stat-number">{stats.totalSubmitted}</div>
                    <div class="slds-text-body_small">{submittedPercentage}%</div>
                </div>
            </div>

            <!-- Pending -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
                <div class="slds-box slds-box_small stat-card stat-warning">
                    <div class="slds-text-title_caps slds-text-color_weak">Pending</div>
                    <div class="slds-text-heading_large stat-number">{stats.totalPending}</div>
                    <div class="slds-text-body_small">{pendingPercentage}%</div>
                </div>
            </div>

            <!-- Expired -->
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-p-bottom_small">
                <div class="slds-box slds-box_small stat-card stat-error">
                    <div class="slds-text-title_caps slds-text-color_weak">Expired</div>
                    <div class="slds-text-heading_large stat-number">{stats.totalExpired}</div>
                    <div class="slds-text-body_small">{expiredPercentage}%</div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <lightning-card title="Filters" icon-name="utility:filterList" class="slds-m-bottom_medium">
            <div slot="actions">
                <lightning-button
                    label="Clear Filters"
                    variant="neutral"
                    onclick={handleClearFilters}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Export CSV"
                    variant="neutral"
                    onclick={handleExport}
                    icon-name="utility:download">
                </lightning-button>
            </div>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-combobox
                            name="scenario"
                            label="Scenario"
                            value={filterScenario}
                            options={scenarioFilterOptions}
                            onchange={handleScenarioFilter}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-combobox
                            name="status"
                            label="Status"
                            value={filterStatus}
                            options={statusOptions}
                            onchange={handleStatusFilter}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-combobox
                            name="program"
                            label="Program"
                            value={filterProgram}
                            options={programFilterOptions}
                            onchange={handleProgramFilter}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-input
                            type="date"
                            name="dateFrom"
                            label="From Date"
                            value={filterDateFrom}
                            onchange={handleDateFromChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-5">
                        <lightning-input
                            type="date"
                            name="dateTo"
                            label="To Date"
                            value={filterDateTo}
                            onchange={handleDateToChange}>
                        </lightning-input>
                    </div>
                </div>
            </div>
        </lightning-card>

        <!-- Feedback Records Table -->
        <lightning-card title="Feedback Records" icon-name="standard:feedback">
            <div slot="actions">
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh"
                    onclick={handleRefresh}>
                </lightning-button-icon>
            </div>
            <div class="slds-p-horizontal_medium">
                <template if:true={filteredRecords.length}>
                    <lightning-datatable
                        key-field="feedbackId"
                        data={paginatedRecords}
                        columns={feedbackColumns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column>
                    </lightning-datatable>

                    <!-- Pagination -->
                    <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                        <lightning-button
                            label="Previous"
                            icon-name="utility:chevronleft"
                            onclick={handlePreviousPage}
                            disabled={disablePrevious}>
                        </lightning-button>
                        <span class="slds-m-horizontal_medium slds-align-middle">
                            {pageInfo}
                        </span>
                        <lightning-button
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            onclick={handleNextPage}
                            disabled={disableNext}>
                        </lightning-button>
                    </div>
                </template>
                <template if:false={filteredRecords.length}>
                    <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                        No feedback records found matching the selected filters.
                    </div>
                </template>
            </div>
        </lightning-card>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
