<template>
    <div class="slds-modal__content slds-p-around_medium">
        <!-- ══════════════════════════════════════════════════════════════════════════ -->
        <!-- STEP 1: AUDIENCE SELECTION -->
        <!-- ══════════════════════════════════════════════════════════════════════════ -->
        <template if:true={isStepOne}>
            <!-- Header -->
            <div class="slds-m-bottom_medium">
                <h2 class="slds-text-heading_medium">Send Email to Students</h2>
            </div>

            <!-- Audience selector -->
            <div class="slds-form-element slds-m-bottom_medium">
                <label class="slds-form-element__label slds-text-title_bold">Select Audience</label>
                <div class="slds-form-element__control">
                    <lightning-radio-group
                        name="audience"
                        options={audienceOptions}
                        value={audience}
                        type="radio"
                        onchange={handleAudienceChange}
                        class="slds-m-top_x-small">
                    </lightning-radio-group>
                </div>
                <div class="slds-form-element__help slds-m-top_x-small">
                    <template if:true={isRegisteredAudience}>
                        Email will be sent only to students who have registered for this workshop.
                    </template>
                    <template if:false={isRegisteredAudience}>
                        Email will be sent to all eligible students in the program, regardless of registration status.
                    </template>
                </div>
            </div>

            <!-- Actions -->
            <div class="slds-modal__footer slds-modal__footer_directional">
                <lightning-button 
                    label="Cancel" 
                    onclick={handleCancel}>
                </lightning-button>
                <lightning-button 
                    variant="brand" 
                    label="Continue" 
                    onclick={handleContinue}>
                </lightning-button>
            </div>
        </template>

        <!-- ══════════════════════════════════════════════════════════════════════════ -->
        <!-- STEP 2: EMAIL COMPOSER -->
        <!-- ══════════════════════════════════════════════════════════════════════════ -->
        <template if:true={isStepTwo}>
            <template if:false={isSent}>
                <!-- Header -->
                <div class="slds-m-bottom_medium">
                    <h2 class="slds-text-heading_medium">Send Email to Students</h2>
                </div>

                <!-- Selected Audience Display -->
                <div class="slds-box slds-box_x-small slds-theme_shade slds-m-bottom_medium">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:groups" size="x-small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <span class="slds-text-body_small">
                                <template if:true={isRegisteredAudience}>
                                    <strong>Audience:</strong> Registered students only
                                </template>
                                <template if:false={isRegisteredAudience}>
                                    <strong>Audience:</strong> All enrolled students
                                </template>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Subject -->
                <lightning-input
                    label="Subject"
                    value={subject}
                    onchange={handleSubjectChange}
                    required
                    placeholder="e.g. Pre-read materials for upcoming workshop"
                    max-length="255"
                    class="slds-m-bottom_small">
                </lightning-input>
                <template if:true={subjectError}>
                    <div class="slds-text-color_error slds-m-bottom_small">{subjectError}</div>
                </template>

                <!-- Body -->
                <lightning-textarea
                    label="Message"
                    value={body}
                    onchange={handleBodyChange}
                    required
                    placeholder="Write your message here..."
                    class="slds-m-bottom_small">
                </lightning-textarea>
                <template if:true={bodyError}>
                    <div class="slds-text-color_error slds-m-bottom_small">{bodyError}</div>
                </template>

                <!-- Optional Link -->
                <lightning-input
                    label="Resource Link (optional)"
                    type="url"
                    value={resourceLink}
                    onchange={handleLinkChange}
                    placeholder="https://..."
                    field-level-help="If provided, the link will be appended to the email body."
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- File Upload -->
                <div class="slds-form-element slds-m-bottom_medium">
                    <label class="slds-form-element__label">Attachments (optional)</label>
                    <div class="slds-form-element__control">
                        <lightning-file-upload
                            label="Attach Files"
                            name="workshopEmailAttachment"
                            accept={acceptedFormats}
                            record-id={recordId}
                            onuploadfinished={handleFileUpload}
                            multiple>
                        </lightning-file-upload>
                    </div>
                    <template if:true={hasAttachments}>
                        <div class="slds-m-top_small">
                            <template for:each={attachedFiles} for:item="file">
                                <div key={file.documentId} class="slds-media slds-media_center slds-p-around_xx-small slds-theme_shade slds-m-bottom_xx-small">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="doctype:attachment" size="x-small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <span class="slds-text-body_small">{file.name}</span>
                                    </div>
                                    <div class="slds-media__figure slds-media__figure_reverse">
                                        <lightning-button-icon 
                                            icon-name="utility:close" 
                                            alternative-text="Remove" 
                                            title="Remove"
                                            data-id={file.documentId}
                                            onclick={handleRemoveFile}>
                                        </lightning-button-icon>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Error banner -->
                <template if:true={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <lightning-icon icon-name="utility:error" size="x-small" variant="error" class="slds-m-right_x-small"></lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <!-- Actions -->
                <div class="slds-modal__footer slds-modal__footer_directional">
                    <lightning-button 
                        label="Back" 
                        icon-name="utility:back"
                        onclick={handleBack}
                        disabled={isSending}>
                    </lightning-button>
                    <lightning-button 
                        variant="brand"
                        label={sendButtonLabel}
                        onclick={handleSend}
                        disabled={isSending}>
                    </lightning-button>
                </div>
            </template>

            <!-- Success state -->
            <template if:true={isSent}>
                <div class="slds-align_absolute-center slds-m-vertical_xx-large">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:success" size="large" variant="success"></lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_medium">Email Sent Successfully</h2>
                        <p class="slds-text-body_regular slds-m-top_small slds-m-bottom_medium">Your message has been sent to the selected audience for this workshop.</p>
                        <lightning-button 
                            label="Close" 
                            onclick={handleCancel}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
