<template>
    <div class="slds-card">
        <div class="slds-p-around_medium">
            <!-- OTP Authentication Section -->
            <template if:false={isOtpVerified}>
                <div class="slds-text-heading_medium slds-m-bottom_medium slds-text-align_center">
                    Student Guest Portal
                </div>
                <div class="slds-text-body_regular slds-m-bottom_medium slds-text-align_center slds-text-color_weak">
                    Please verify your email to access your cases and fees
                </div>
                <c-guest-otp-auth onverified={handleVerified}></c-guest-otp-auth>
            </template>

            <!-- Main Portal Content After Authentication -->
            <template if:true={isOtpVerified}>

                <!-- Tabs for My Cases and Fees & Payments -->
                <lightning-tabset active-tab-value={activeTab}>
                    <!-- My Cases Tab -->
                    <lightning-tab label="My Cases" value="myCases" icon-name="standard:case">
                        <div class="slds-p-around_small">
<!--new change Prajwal-->
                            <!-- Case Detail View (inline, replaces list when a case is selected) -->
                            <template if:true={selectedGuestCaseId}>
                                <!-- Back to cases bar -->
                                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                                    <div class="slds-col">
                                        <lightning-button
                                            variant="neutral"
                                            label="Back to My Cases"
                                            onclick={handleBackToCaseList}
                                            icon-name="utility:back">
                                        </lightning-button>
                                    </div>
                                </div>
                                <!-- Full case detail form rendered inline with record-id -->
                                <c-case-l-o-a-form
                                    record-id={selectedGuestCaseId}
                                    guest-email={email}
                                    contact-id={contactId}
                                    contact-name={contactName}>
                                </c-case-l-o-a-form>
                            </template>

                            <!-- Case List View (shown by default) -->
                            <template if:false={selectedGuestCaseId}>
                                <c-case-l-o-a-form
                                    guest-email={email}
                                    contact-id={contactId}
                                    contact-name={contactName}
                                    onshowcasedetail={handleShowCaseDetail}>
                                </c-case-l-o-a-form>
                            </template>
<!--new change Prajwal-->
                        </div>
                    </lightning-tab>

                    <!-- Fees and Payments Tab -->
                    <lightning-tab label="Fees and Payments" value="feesPayments" icon-name="standard:payment_gateway">
                        <div class="slds-p-around_small">
                            <c-my-fees-and-payments
                                guest-email={email}
                                contact-id={contactId}>
                            </c-my-fees-and-payments>
                        </div>
                    </lightning-tab>

                </lightning-tabset>
            </template>
        </div>
    </div>
</template>
