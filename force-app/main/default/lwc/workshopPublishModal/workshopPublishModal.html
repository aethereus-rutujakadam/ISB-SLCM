<template>
    <lightning-card title="Publish Workshop" icon-name="standard:email">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading..."></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-around_medium">
                <!-- Recipient Preview -->
                <div class="slds-m-bottom_medium">
                    <p class="slds-text-heading_small">Email Preview</p>
                    <p class="slds-text-body_regular slds-text-color_weak">
                        This email will be sent to: <strong>{recipientPreview}</strong>
                    </p>
                </div>

                <!-- Subject Field -->
                <lightning-input
                    label="Email Subject"
                    value={subject}
                    onchange={handleSubjectChange}
                    required
                    class="slds-m-bottom_small">
                </lightning-input>

                <!-- Body Field -->
                <lightning-textarea
                    label="Email Body"
                    value={body}
                    onchange={handleBodyChange}
                    required
                    rows="8"
                    class="slds-m-bottom_small">
                </lightning-textarea>

                <!-- Resource Link Field -->
                <lightning-input
                    label="Resource Link (optional)"
                    type="url"
                    value={resourceLink}
                    onchange={handleResourceLinkChange}
                    placeholder="https://..."
                    class="slds-m-bottom_small">
                    <p slot="field-level-help">If provided, the link will be appended to the email body.</p>
                </lightning-input>

                <!-- File Upload -->
                <div class="slds-m-bottom_medium">
                    <label class="slds-form-element__label">Attachments (optional)</label>
                    <lightning-file-upload
                        label="Attach Files"
                        name="workshopPublishAttachment"
                        accept={acceptedFormats}
                        record-id={recordId}
                        onuploadfinished={handleFileUpload}
                        multiple>
                    </lightning-file-upload>
                    <template if:true={hasAttachments}>
                        <div class="slds-m-top_small">
                            <template for:each={attachedFiles} for:item="file">
                                <div key={file.documentId} class="slds-media slds-media_center slds-p-around_xx-small" style="background: #f4f6fb; border: 1px solid #dde3ef; border-radius: 4px; margin-bottom: 0.25rem;">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="doctype:attachment" size="x-small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <span class="slds-text-body_small">{file.name}</span>
                                    </div>
                                    <div class="slds-media__figure slds-media__figure_reverse">
                                        <button class="slds-button slds-button_icon" data-id={file.documentId} onclick={handleRemoveFile} title="Remove">
                                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>

                <!-- Action Buttons -->
                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                        disabled={isPublishing}
                        class="slds-m-right_x-small">
                    </lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Publish & Send"
                        onclick={handlePublish}
                        disabled={isPublishDisabled}>
                    </lightning-button>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
