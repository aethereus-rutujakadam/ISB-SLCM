<template>
    <lightning-card title="My Payments" icon-name="custom:custom63">

        <!-- Spinner -->
        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={error}>
            <div class="slds-m-around_medium slds-text-color_error">
                {error}
            </div>
        </template>

        <!-- Table -->
        <template if:true={hasPayments}>
            <div class="slds-m-around_medium">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered payment-table">
                    <thead>
                        <tr>
                            <th>Payment</th>
                            <th>Payment Type</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Mode</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={payments} for:item="p">
                            <tr key={p.Id}>
                                <td><strong>{p.Name}</strong></td>
                                <td>{p.paymentType}</td>
                                <td>{p.paymentDate}</td>
                                <td>{p.formattedAmount}</td>
                                <td>{p.Payment_Mode__c}</td>
                                <td>
                                    <span class={p.statusClass}>
                                        {p.Initiated__c}
                                    </span>
                                </td>
                                <td>
                                    <template if:true={p.isSuccess}>
                                        <lightning-button
                                            label="Download Receipt"
                                            icon-name="utility:download"
                                            data-id={p.Id}
                                            onclick={handleDownload}
                                            variant="brand-outline">
                                        </lightning-button>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <p class="slds-text-body_small slds-m-top_small slds-text-color_weak">
                    Showing {totalPayments} payment(s)
                </p>
            </div>
        </template>

        <!-- Empty State -->
      <!-- Empty State -->
<template if:false={hasPayments}>
    <template if:false={isLoading}>
        <template if:false={error}>
            <div class="slds-align_absolute-center slds-p-around_xx-large">
                <div class="slds-text-align_center">

                    <lightning-icon
                        icon-name="custom:custom63"
                        size="large"
                        class="slds-m-bottom_medium empty-state-icon">
                    </lightning-icon>

                    <h3 class="slds-text-heading_medium slds-m-bottom_x-small">
                        No Payments Available
                    </h3>

                    <p class="slds-text-body_regular slds-text-color_weak">
                        You don’t have any payments at this time.
                    </p>

                </div>
            </div>
        </template>
    </template>
</template>


    </lightning-card>
</template>
