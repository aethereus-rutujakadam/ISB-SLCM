<template>
    <lightning-card title="Upload Course Checklist Templates from Excel" icon-name="doctype:xlsx">
        <div class="slds-p-around_medium">

            <p class="slds-m-bottom_medium">
                Upload course checklist <b>templates</b>. These will be automatically cloned and assigned when a Course Manager is created.<br />
                Required columns:<br />
                <strong>Subject | Description | Priority | Role | CourseType | Start Date | End Date | Logic Calculation</strong>
            </p>

            <!-- File Picker -->
            <lightning-input
                type="file"
                accept=".xls,.xlsx"
                label="Select Excel File"
                onchange={handleFileChange}
                disabled={isLoading}>
            </lightning-input>

            <!-- Record count -->
            <template if:true={fileName}>
                <div class="slds-m-vertical_small">
                    <p><b>{recordsCount} template(s) loaded:</b> {fileName}</p>
                </div>
            </template>

            <!-- Preview Table -->
            <template if:true={columns.length}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        key-field="id"
                        data={fileData}
                        columns={columns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

            <!-- Buttons -->
            <div class="slds-m-top_medium slds-grid">
                <lightning-button
                    label="Upload and Create Templates"
                    variant="brand"
                    onclick={handleUploadClick}
                    disabled={isUploadDisabled}>
                </lightning-button>
                <lightning-button
                    label="Reset"
                    variant="neutral"
                    onclick={resetForm}
                    class="slds-m-left_small">
                </lightning-button>
            </div>

            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
            </template>

        </div>
    </lightning-card>
</template>
