<template>
    <lightning-card title={cardTitle} icon-name="standard:people">
        <!-- Main Content -->
        <div class="slds-p-horizontal_small">
            
            <!-- Loading -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_medium">
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </div>
            </template>

            <!-- Table — Removed fixed height to eliminate empty space -->
            <template if:false={isLoading}>
                <template if:true={hasData}>
                    <lightning-datatable
                        key-field="Id"
                        data={displayedRelationships}
                        columns={columns}
                        hide-checkbox-column
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </template>
                
                <!-- No Data -->
                <template if:false={hasData}>
                    <div class="slds-text-align_center slds-m-vertical_small slds-p-around_medium">
                        No relationships found.
                    </div>
                </template>
            </template>
        </div>

        <!-- Footer -->
        <template if:true={hasMore}>
            <div slot="footer">
                <a class="slds-card__footer-action" href="javascript:void(0);" onclick={handleViewAll}>View All</a>
            </div>
        </template>
    </lightning-card>

    <!-- Detail Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading" class="slds-modal__title slds-hyphenate">{selectedRecord.Name_of_the_Person_c__c}</h2>
                    <p class="slds-m-top_x-small">Relationship Details</p>
                </header>

                <!-- Modal Body — Fixed Parallel Lines -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content">
                    <template for:each={modalSections} for:item="section">
                        <div key={section.title} class="slds-section slds-is-open">
                            <h3 class="slds-section__title slds-theme_shade">
                                <span class="slds-truncate slds-p-horizontal_small">{section.title}</span>
                            </h3>
                            <div class="slds-section__content">
                                <div class="slds-grid slds-wrap">
                                    <template for:each={section.fields} for:item="field">
                                        <!-- Removed slds-border_bottom to fix the "double line" issue and clean up UI -->
                                        <div key={field.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-vertical_small">
                                            <div class="slds-form-element slds-form-element_readonly slds-grid">
                                                <span class="slds-form-element__label slds-size_1-of-2">{field.label}</span>
                                                <div class="slds-form-element__control slds-size_1-of-2">
                                                    <div class="slds-form-element__static slds-text-word-break">{field.value}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeModal} variant="neutral"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
