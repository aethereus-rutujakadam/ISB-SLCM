<template>
    <template if:true={debugInfo}></template>

    <lightning-card title="Student List" icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <!-- Filters -->
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox name="program" label="Program" value={selectedProgram} options={programOptions}
                        onchange={handleProgramChange} placeholder="Select Program">
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox name="session" label="Academic Session" value={selectedSession}
                        options={sessionOptions} onchange={handleSessionChange} disabled={disableSession}
                        placeholder="Select Session">
                    </lightning-combobox>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <lightning-combobox name="course" label="Course" value={selectedCourse} options={courseOptions}
                        onchange={handleCourseChange} disabled={disableCourse} placeholder="Select Course">
                    </lightning-combobox>
                </div>
            </div>

            <!-- Action Buttons Row -->
            <div class="slds-m-top_medium slds-grid slds-gutters">
                <!-- Left side buttons -->
                <div class="slds-col slds-size_6-of-12">
                    <!-- <lightning-button label="Search Students" variant="brand" onclick={searchStudents} -->
                        <!-- disabled={disableSearch} class="slds-m-right_x-small"> -->
                    <!-- </lightning-button> -->

                    <lightning-button label="Clear Filters" variant="neutral" onclick={clearFilters}
                        class="slds-m-right_x-small">
                    </lightning-button>

                    <template if:true={hasStudents}>
                        <lightning-button label="Check All" variant="base" onclick={selectAll}
                            class="slds-m-right_x-small">
                        </lightning-button>

                        <lightning-button label="Uncheck All" variant="base" onclick={deselectAll}
                            class="slds-m-right_x-small">
                        </lightning-button>
                    </template>
                </div>

                <!-- Right side buttons -->
                <div class="slds-col slds-size_6-of-12 slds-text-align_right">
                    <template if:true={hasSelection}>
                        <span class="slds-badge slds-m-right_small">Selected: {selectedCount}</span>
                    </template>

                    <lightning-button label="Send Notification" variant="brand" icon-name="utility:email"
                        onclick={sendNotifications} disabled={disableSendButton} class="slds-m-left_x-small">
                    </lightning-button>
                </div>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-m-around_large slds-text-align_center">
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </div>
            </template>

            <!-- Results Section -->
            <template if:true={hasStudents}>
                <div class="slds-m-top_large">
                    <lightning-datatable
                        key-field="studentId"
                        data={students}
                        columns={columns}
                        selected-rows={selectedStudentIds}
                        onrowselection={handleRowSelection}
                        default-sort-direction={defaultSortDirection}
                        sorted-direction={sortDirection}
                        onsort={handleSort}
                        hide-checkbox-column={hideCheckboxColumn}>
                    </lightning-datatable>

                    <div class="slds-m-top_small slds-text-align_right">
                        <span class="slds-text-body_regular">
                            Total Students: {students.length} | Selected: {selectedCount}
                        </span>
                    </div>
                </div>
            </template>

            <!-- No Results Message -->
            <template if:true={showNoResults}>
                <div class="slds-m-top_large slds-text-align_center">
                    <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                    <span class="slds-m-left_x-small">No students found for the selected filters.</span>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
