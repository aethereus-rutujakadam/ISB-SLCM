<template>
    <lightning-card title="Raise a Request" icon-name="standard:case">
        <div class="slds-p-around_medium">
            
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- ============================================ -->
            <!-- STEP 1: EMAIL ENTRY -->
            <!-- ============================================ -->
            <template if:true={showEmailStep}>
                <div class="slds-box slds-box_small slds-theme_default">
                    <div class="slds-text-heading_small slds-m-bottom_small">
                        <lightning-icon icon-name="utility:email" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Verify Your Email
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                        Enter your registered email address to receive a verification code.
                    </p>
                    
                    <lightning-input
                        type="email"
                        label="Email Address"
                        value={email}
                        onchange={handleEmailChange}
                        required
                        placeholder="your.email@example.com">
                    </lightning-input>
                    
                    <template if:true={emailError}>
                        <div class="slds-text-color_error slds-m-top_x-small slds-text-body_small">
                            <lightning-icon icon-name="utility:error" size="xx-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                            {emailError}
                        </div>
                    </template>
                    
                    <div class="slds-m-top_medium">
                        <lightning-button 
                            variant="brand" 
                            label="Send Verification Code" 
                            onclick={handleSendOTP}
                            disabled={isLoading}
                            class="slds-m-right_x-small">
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- ============================================ -->
            <!-- STEP 2: OTP VERIFICATION -->
            <!-- ============================================ -->
            <template if:true={showOtpStep}>
                <div class="slds-box slds-box_small slds-theme_default">
                    <div class="slds-text-heading_small slds-m-bottom_small">
                        <lightning-icon icon-name="utility:lock" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        Enter Verification Code
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                        We've sent a 6-digit verification code to <strong>{email}</strong>
                    </p>
                    
                    <lightning-input
                        type="text"
                        label="Verification Code"
                        value={otp}
                        onchange={handleOtpChange}
                        required
                        maxlength="6"
                        placeholder="Enter 6-digit code"
                        pattern="[0-9]*"
                        inputmode="numeric">
                    </lightning-input>
                    
                    <template if:true={otpError}>
                        <div class="slds-text-color_error slds-m-top_x-small slds-text-body_small">
                            <lightning-icon icon-name="utility:error" size="xx-small" variant="error" class="slds-m-right_xx-small"></lightning-icon>
                            {otpError}
                        </div>
                    </template>
                    
                    <div class="slds-m-top_medium">
                        <lightning-button 
                            variant="brand" 
                            label="Verify Code" 
                            onclick={handleVerifyOTP}
                            disabled={isLoading}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        
                        <lightning-button 
                            variant="neutral" 
                            label="Resend Code" 
                            onclick={handleResendOTP}
                            disabled={isResending}
                            class="slds-m-right_x-small">
                        </lightning-button>
                        
                        <lightning-button 
                            variant="neutral" 
                            label="Back" 
                            onclick={handleBackToEmail}>
                        </lightning-button>
                    </div>
                    
                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        Code expires in 10 minutes
                    </div>
                </div>
            </template>

            <!-- ============================================ -->
            <!-- STEP 3: CASE REQUEST FORM -->
            <!-- ============================================ -->
            <template if:true={showRequestStep}>
                <div class="slds-box slds-box_small slds-theme_default">
                    <!-- Header -->
                    <div class="slds-text-heading_small slds-m-bottom_medium">
                        <lightning-icon icon-name="standard:case" size="small" class="slds-m-right_x-small"></lightning-icon>
                        Submit Your Request
                    </div>
                    
                    <!-- Case Type (Record Type) -->
                    <div class="slds-m-bottom_small">
                        <lightning-combobox
                            name="recordType"
                            label="Case Type"
                            value={selectedRecordTypeId}
                            options={recordTypeOptions}
                            onchange={handleRecordTypeChange}
                            required
                            placeholder="Select case type">
                        </lightning-combobox>
                    </div>

                    <!-- Program Enrollment -->
                    <div class="slds-m-bottom_small">
                        <lightning-combobox
                            name="programEnrollment"
                            label="Program"
                            value={selectedPeId}
                            options={programEnrollmentOptions}
                            onchange={handlePeChange}
                            required
                            placeholder="Select your program">
                        </lightning-combobox>
                    </div>

                    <!-- Term/Semester -->
                    <div class="slds-m-bottom_small">
                        <lightning-combobox
                            name="term"
                            label="Term/Semester"
                            value={selectedEsId}
                            options={termOptions}
                            onchange={handleTermChange}
                            required
                            disabled={isTermDisabled}
                            placeholder="Select term">
                        </lightning-combobox>
                    </div>

                    <!-- Description -->
                    <div class="slds-m-bottom_medium">
                        <lightning-textarea
                            label="Description"
                            value={caseDescription}
                            onchange={handleDescriptionChange}
                            required
                            placeholder="Please provide details about your request..."
                            max-length="5000">
                        </lightning-textarea>
                    </div>

                    <!-- Summary Box (if form is filled) -->
                    <template if:true={isFormValid}>
                        <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                            <div class="slds-text-title_caps slds-m-bottom_x-small">
                                <lightning-icon icon-name="utility:summary" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                Request Summary
                            </div>
                            <dl class="slds-dl_horizontal">
                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Case Type:</p>
                                </dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <p>{selectedRecordTypeName}</p>
                                </dd>
                                
                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Program:</p>
                                </dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <p>{selectedPeLabel}</p>
                                </dd>
                                
                                <dt class="slds-dl_horizontal__label">
                                    <p class="slds-truncate">Term:</p>
                                </dt>
                                <dd class="slds-dl_horizontal__detail">
                                    <p>{selectedTermLabel}</p>
                                </dd>
                            </dl>
                        </div>
                    </template>

                    <!-- Submit Button -->
                    <div class="slds-m-top_medium">
                        <lightning-button 
                            variant="brand" 
                            label="Submit Request" 
                            onclick={handleSubmitCase}
                            disabled={isLoading}
                            icon-name="utility:check">
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- ============================================ -->
            <!-- SUCCESS SCREEN -->
            <!-- ============================================ -->
            <template if:true={showSuccessScreen}>
                <div class="slds-box slds-p-around_medium">
                    <div class="slds-text-align_center">
                        <lightning-icon 
                            icon-name="utility:success" 
                            size="large" 
                            variant="success"
                            class="slds-m-bottom_small">
                        </lightning-icon>
                        
                        <h2 class="slds-text-heading_medium slds-theme_success slds-m-bottom_small">
                            Request Submitted Successfully!
                        </h2>
                        
                        <p class="slds-text-body_regular slds-m-bottom_medium">
                            Your request has been submitted and is under review. 
                            You will receive updates via email.
                        </p>
                        
                        <template if:true={createdCaseNumber}>
                            <div class="slds-box slds-theme_default slds-m-bottom_medium">
                                <p class="slds-text-body_small slds-text-color_weak">Case Number</p>
                                <p class="slds-text-heading_small">{createdCaseNumber}</p>
                            </div>
                        </template>
                        
                        <lightning-button 
                            variant="brand" 
                            label="Submit Another Request" 
                            onclick={handleStartNew}
                            icon-name="utility:add">
                        </lightning-button>
                    </div>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
