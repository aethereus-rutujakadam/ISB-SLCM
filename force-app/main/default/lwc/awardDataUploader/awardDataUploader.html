<template>
    <div class="slds-p-around_medium">

        <!-- Minimal Header -->
        <div class="slds-m-bottom_medium">
            <h1 class="slds-text-heading_small">Bulk Award Winner Upload</h1>
        </div>

        <!-- Simple File Input -->
        <lightning-input
            type="file"
            accept=".xls,.xlsx"
            label="Select Excel File"
            onchange={handleFileChange}
            disabled={isLoading}>
        </lightning-input>

        <!-- Record Count -->
        <template if:true={fileData.length}>
            <div class="slds-m-vertical_small">
                <p><b>{fileData.length} records loaded:</b> {fileName}</p>
            </div>
        </template>

        <!-- Data Preview -->
        <template if:true={fileData.length}>
            <div class="slds-m-top_medium slds-box slds-theme_default">
                <lightning-datatable
                    key-field="id"
                    data={fileData}
                    columns={dynamicColumns}
                    hide-checkbox-column>
                </lightning-datatable>
            </div>
        </template>

        <!-- Action Buttons -->
        <div class="slds-m-top_medium slds-grid slds-gutters_small">

            <lightning-button 
                label="Submit Awards"
                variant="brand"
                onclick={handleSubmit}
                disabled={isSubmitDisabled}>
            </lightning-button>

            <lightning-button 
                label="Reset"
                variant="neutral"
                onclick={resetForm}>
            </lightning-button>

            <!-- Download Error Report Button -->
            <template if:true={errorCSV}>
                <lightning-button
                    label="Download Error Report"
                    variant="destructive"
                    onclick={downloadErrorCSV}>
                </lightning-button>
            </template>

        </div>

        <!-- Minimal Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
        </template>

    </div>
</template>
