<template>
    <div class="slds-p-around_medium">
        <!-- Template List View -->
        <template if:false={hasSelectedTemplate}>
            <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                <h2 class="slds-text-heading_medium">Feedback Templates</h2>
                <lightning-button
                    label="New Template"
                    variant="brand"
                    onclick={handleNewTemplate}
                    icon-name="utility:add">
                </lightning-button>
            </div>

            <lightning-datatable
                key-field="templateId"
                data={templates}
                columns={templateColumns}
                onrowaction={handleTemplateRowAction}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <!-- Question Management View -->
        <template if:true={hasSelectedTemplate}>
            <div class="slds-grid slds-grid_align-spread slds-m-bottom_medium">
                <div>
                    <lightning-button
                        label="Back to Templates"
                        variant="neutral"
                        onclick={handleBackToTemplates}
                        icon-name="utility:back"
                        class="slds-m-right_small">
                    </lightning-button>
                    <span class="slds-text-heading_medium">
                        Questions for: {selectedTemplate.name}
                    </span>
                </div>
                <lightning-button
                    label="New Question"
                    variant="brand"
                    onclick={handleNewQuestion}
                    icon-name="utility:add">
                </lightning-button>
            </div>

            <!-- Questions List -->
            <div class="slds-box">
                <template if:true={selectedTemplateQuestions.length}>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col" style="width: 50px;">#</th>
                                <th scope="col">Question</th>
                                <th scope="col" style="width: 100px;">Type</th>
                                <th scope="col" style="width: 80px;">Weight</th>
                                <th scope="col" style="width: 80px;">Required</th>
                                <th scope="col" style="width: 200px;">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={selectedTemplateQuestions} for:item="question" for:index="index">
                                <tr key={question.questionId}>
                                    <td>{question.displayOrder}</td>
                                    <td>{question.questionText}</td>
                                    <td>{question.questionType}</td>
                                    <td>{question.weightage}</td>
                                    <td>
                                        <template if:true={question.isRequired}>
                                            <lightning-icon icon-name="utility:check" size="x-small" variant="success"></lightning-icon>
                                        </template>
                                    </td>
                                    <td>
                                        <lightning-button-icon
                                            icon-name="utility:up"
                                            alternative-text="Move Up"
                                            data-id={question.questionId}
                                            data-direction="up"
                                            onclick={handleMoveQuestion}
                                            class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:down"
                                            alternative-text="Move Down"
                                            data-id={question.questionId}
                                            data-direction="down"
                                            onclick={handleMoveQuestion}
                                            class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:edit"
                                            alternative-text="Edit"
                                            data-id={question.questionId}
                                            onclick={handleEditQuestion}
                                            class="slds-m-right_xx-small">
                                        </lightning-button-icon>
                                        <lightning-button-icon
                                            icon-name="utility:delete"
                                            alternative-text="Delete"
                                            data-id={question.questionId}
                                            onclick={handleDeleteQuestion}
                                            variant="error">
                                        </lightning-button-icon>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
                <template if:false={selectedTemplateQuestions.length}>
                    <div class="slds-text-align_center slds-p-around_large slds-text-color_weak">
                        No questions yet. Click "New Question" to add one.
                    </div>
                </template>
            </div>
        </template>

        <!-- Template Modal -->
        <template if:true={showTemplateModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            onclick={handleCloseModal}
                            class="slds-modal__close">
                        </lightning-button-icon>
                        <h2 class="slds-modal__title">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            name="name"
                            label="Template Name"
                            value={templateForm.name}
                            onchange={handleTemplateInputChange}
                            required
                            class="slds-m-bottom_small">
                        </lightning-input>
                        
                        <lightning-combobox
                            name="applicableFor"
                            label="Applicable For"
                            value={templateForm.applicableFor}
                            options={scenarioOptions}
                            onchange={handleTemplateInputChange}
                            required
                            class="slds-m-bottom_small">
                        </lightning-combobox>
                        
                        <lightning-textarea
                            name="description"
                            label="Description"
                            value={templateForm.description}
                            onchange={handleTemplateInputChange}
                            class="slds-m-bottom_small">
                        </lightning-textarea>
                        
                        <lightning-input
                            type="checkbox"
                            name="isActive"
                            label="Active"
                            checked={templateForm.isActive}
                            onchange={handleTemplateInputChange}>
                        </lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseModal}>
                        </lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSaveTemplate}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Question Modal -->
        <template if:true={showQuestionModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            onclick={handleCloseModal}
                            class="slds-modal__close">
                        </lightning-button-icon>
                        <h2 class="slds-modal__title">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-textarea
                            name="questionText"
                            label="Question Text"
                            value={questionForm.questionText}
                            onchange={handleQuestionInputChange}
                            required
                            class="slds-m-bottom_small">
                        </lightning-textarea>
                        
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-combobox
                                    name="questionType"
                                    label="Question Type"
                                    value={questionForm.questionType}
                                    options={questionTypeOptions}
                                    onchange={handleQuestionInputChange}
                                    required
                                    class="slds-m-bottom_small">
                                </lightning-combobox>
                            </div>
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="number"
                                    name="weightage"
                                    label="Weightage"
                                    value={questionForm.weightage}
                                    min="0"
                                    step="0.1"
                                    onchange={handleQuestionInputChange}
                                    class="slds-m-bottom_small">
                                </lightning-input>
                            </div>
                        </div>

                        <div class="slds-grid slds-gutters">
                            <div class="slds-col slds-size_1-of-2">
                                <lightning-input
                                    type="number"
                                    name="displayOrder"
                                    label="Display Order"
                                    value={questionForm.displayOrder}
                                    min="1"
                                    onchange={handleQuestionInputChange}
                                    class="slds-m-bottom_small">
                                </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-p-top_large">
                                <lightning-input
                                    type="checkbox"
                                    name="isRequired"
                                    label="Required"
                                    checked={questionForm.isRequired}
                                    onchange={handleQuestionInputChange}>
                                </lightning-input>
                            </div>
                        </div>
                        
                        <!-- Picklist Options (for Picklist type) -->
                        <template if:true={isPicklistType}>
                            <lightning-textarea
                                name="picklistOptions"
                                label="Picklist Options (semicolon-separated)"
                                value={questionForm.picklistOptions}
                                placeholder="Strongly Agree;Agree;Neutral;Disagree;Strongly Disagree"
                                onchange={handleQuestionInputChange}
                                class="slds-m-bottom_small">
                            </lightning-textarea>
                        </template>

                        <!-- Rating Options (for Rating type) -->
                        <template if:true={isRatingType}>
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input
                                        type="number"
                                        name="minRating"
                                        label="Min Rating"
                                        value={questionForm.minRating}
                                        min="1"
                                        onchange={handleQuestionInputChange}
                                        class="slds-m-bottom_small">
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-input
                                        type="number"
                                        name="maxRating"
                                        label="Max Rating"
                                        value={questionForm.maxRating}
                                        min="1"
                                        onchange={handleQuestionInputChange}
                                        class="slds-m-bottom_small">
                                    </lightning-input>
                                </div>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCloseModal}>
                        </lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={handleSaveQuestion}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>
    </div>
</template>
