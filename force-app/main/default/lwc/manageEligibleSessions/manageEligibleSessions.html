<template>
    <lightning-card title="Manage Eligible Academic Sessions" icon-name="standard:list">
        <div class="slds-m-around_medium">
            <!-- Loading Spinner -->
            <lightning-spinner if:true={isLoading} alternative-text="Loading..."></lightning-spinner>

            <!-- Error Alert -->
            <div if:true={hasError} class="slds-m-bottom_medium">
                <lightning-alert variant="error" onclose={handleClose}>
                    {errorMessage}
                </lightning-alert>
            </div>

            <!-- Content -->
            <template if:false={isLoading}>
                <!-- Academic Term Header -->
                <div class="slds-m-bottom_large">
                    <p class="term-header">
                        <strong>Academic Term:</strong> <span class="term-name">{academicTermName}</span>
                    </p>
                    <p class="instructions">
                        Choose the academic sessions that students must register for when paying this installment.
                    </p>
                </div>

                <!-- Existing Records Warning -->
                <template if:true={showExistingWarning}>
                    <div class="warning-banner">
                        <div class="warning-content">
                            <span class="warning-icon">ℹ️</span>
                            <div class="warning-text">
                                <strong>Note:</strong> The following {existingRecordCount} session(s) are already eligible and are pre-selected below. You can modify your selections as needed.
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Sessions List -->
                <div class="sessions-container">
                    <div class="session-header">
                        <span class="session-count">Total Sessions: {uniqueSessions.length}</span>
                        <span class="selected-count">Selected: {selectedCount}</span>
                    </div>

                    <div class="sessions-list">
                        <template for:each={uniqueSessions} for:item="session">
                            <div key={session.id} class="session-item">
                                <label class="slds-checkbox">
                                    <input 
                                        type="checkbox"
                                        checked={session.selected}
                                        data-id={session.id}
                                        onchange={handleSessionSelect}
                                    />
                                    <span class="slds-checkbox_faux"></span>
                                    <span class="session-name">{session.name}</span>
                                </label>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="slds-m-top_large button-group">
                    <button 
                        class="slds-button slds-button_brand" 
                        onclick={handleSave}
                        disabled={buttonDisabled}
                    >
                        Save Selections
                    </button>
                    <button 
                        class="slds-button slds-button_neutral" 
                        onclick={handleCancel}
                    >
                        Cancel
                    </button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
