<template>
    <lightning-card title="Upload File">
        <template if:false={contentVersionId}>
            <lightning-file-upload
                name="fileUploader"
                accept={acceptedFormats}
                record-id={recordId}
                onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>
        </template>

        <template if:true={contentDocumentId}>
            <div class="slds-box slds-box_x-small slds-theme_default slds-m-around_small">
                <div class="slds-grid slds-grid_vertical-align-center">
                    <div class="slds-col slds-grow_none slds-m-right_small">
                        <lightning-icon 
                            icon-name="doctype:attachment" 
                            size="large" 
                            alternative-text="File">
                        </lightning-icon>
                    </div>
                    <div class="slds-col">
                        <p class="slds-text-heading_small slds-truncate" title={fName}>{fName}</p>
                        <div class="slds-m-top_x-small">
                            <lightning-button
                                variant="destructive-text"
                                label="Remove File"
                                icon-name="utility:delete"
                                onclick={removeFile}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
