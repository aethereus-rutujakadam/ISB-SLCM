<template>
    <lightning-card>
        <!-- <lightning-icon icon-name="custom:custom85" size="small" class="slds-m-right_small"></lightning-icon>
            <span class="slds-card__header-title">Graduation Eligibility Records</span> -->
        <h3 slot="title">
            <lightning-icon icon-name="custom:custom85" size="small" class="slds-m-right_small"></lightning-icon>
            Graduation Eligibility Records
        </h3>

         <div slot="actions" class="slds-button-group slds-m-right_x-small" role="group">
            <lightning-button 
                label="Send Notification for Graduated"
                onclick={sendGraduationEmails}
                variant="destructive"
                icon-name="utility:email">
            </lightning-button>

            <lightning-button 
                label="Export to Excel"
                onclick={exportToExcel}
                icon-name="utility:download"
                variant="brand"
                disabled={isLoading}>
            </lightning-button>
        </div>

        <div class="slds-p-around_medium">
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                    <p class="slds-m-top_small">Loading graduation eligibility records...</p>
                </div>
            </template>

            <!-- Saving Indicator -->
            <template if:true={isSaving}>
                <div class="slds-notify slds-notify_toast slds-theme_info" role="status">
                    <span class="slds-assistive-text">Info</span>
                    <lightning-icon icon-name="utility:info" size="small" variant="inverse" class="slds-m-right_small">
                    </lightning-icon>
                    <div class="slds-notify__content">
                        <h2 class="slds-text-heading_small">Saving changes...</h2>
                    </div>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-p-around_medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <lightning-icon icon-name="utility:error" size="small" variant="error"
                            class="slds-m-right_small"></lightning-icon>
                        <h2>{error}</h2>
                    </div>
                </div>
            </template>

            <!-- Data Table -->
            <template if:true={hasData}>
                <div class="slds-p-around_medium">
                    <!-- <lightning-datatable
                        key-field="Id"
                        data={eligibilities}
                        columns={columns}
                        draft-values={draftValues}
                        onsave={handleSave}
                        hide-checkbox-column
                        show-row-number-column>
                    </lightning-datatable> -->
                    <c-l-w-c-custom-datatable-type key-field="Id" data={data} columns={columns}
                        onvalueselect={handleSelection} draft-values={draftValues} oncellchange={handleCellChange}
                        onsave={handleSave} oncancel={handleCancel} hide-checkbox-column>
                    </c-l-w-c-custom-datatable-type>
                </div>
            </template>

            <!-- No Data Message -->
            <template if:true={showNoData}>
                <div class="slds-p-around_medium">
                    <div class="slds-text-align_center slds-p-around_x-large">
                        <lightning-icon icon-name="utility:info" size="large" alternative-text="Info"
                            class="slds-icon-text-default"></lightning-icon>
                        <h3 class="slds-text-heading_medium slds-m-top_medium">No Records Found</h3>
                        <p class="slds-text-body_regular slds-m-top_small slds-text-color_weak">
                            No graduation eligibility records found for this Case's Program and Academic Year.
                        </p>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
