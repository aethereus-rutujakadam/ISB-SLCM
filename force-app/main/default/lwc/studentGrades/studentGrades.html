<template>
    <lightning-card title="My Grades" icon-name="standard:education">
        <!-- Removed total results badge from actions slot -->


        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-text-align_center slds-p-around_medium">
                <lightning-spinner alternative-text="Loading grades..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={error}>
            <div class="slds-text-align_center slds-p-around_medium">
                <p class="slds-text-color_error">{error}</p>
            </div>
        </template>

        <!-- No Data -->
        <template if:false={hasData}>
            <template if:false={isLoading}>
                <div class="slds-text-align_center slds-p-around_medium">
                    <lightning-icon icon-name="utility:cap" size="large" class="slds-m-bottom_small"></lightning-icon>
                    <p class="slds-text-color_weak">No grades available.</p>
                </div>
            </template>
        </template>

        <!-- Grouped Tabular Grades with Accordion -->
        <template if:true={hasData}>
            <div class="slds-p-around_small">
                <lightning-accordion allow-multiple-sections-open class="grade-accordion">
                    <template for:each={groupedGrades} for:item="group">
                        <lightning-accordion-section key={group.term} name={group.term} label={group.term}>
                            <div class="slds-scrollable_x">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped" aria-label="Student Grades">
                                    <thead>
                                        <tr class="slds-line-height_reset">
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Course Name">Course Name</div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Attempted Credits">Attempted Credits</div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Earned Credits">Earned Credits</div>
                                            </th>
                                            <th class="" scope="col">
                                                <div class="slds-truncate" title="Grade">Grade</div>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={group.grades} for:item="grade">
                                            <tr key={grade.id} class="slds-hint-parent">
                                                <td data-label="Course Name">
                                                    <div class="slds-truncate" title={grade.learningCourseName}>
                                                        <strong>{grade.learningCourseName}</strong>
                                                        <div class="slds-text-color_weak slds-text-body_small">{grade.courseOfferingName}</div>
                                                    </div>
                                                </td>
                                                <td data-label="Attempted Credits">
                                                    <div class="slds-truncate" title={grade.creditsAttempted}>{grade.creditsAttempted}</div>
                                                </td>
                                                <td data-label="Earned Credits">
                                                    <div class="slds-truncate" title={grade.creditsEarned}>{grade.creditsEarned}</div>
                                                </td>
                                                <td data-label="Grade">
                                                    <div class="slds-badge-container">
                                                        <lightning-badge label={grade.letterGrade} class={grade.badgeClass}></lightning-badge>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </lightning-accordion-section>
                    </template>
                </lightning-accordion>
            </div>
        </template>
    </lightning-card>
</template>
