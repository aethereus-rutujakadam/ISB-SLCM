<template>
    <lightning-card title="Upcoming Invigilation" icon-name="standard:service_appointment">
        <!-- Search Filters -->
        <div class="slds-p-horizontal_medium slds-p-top_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <!-- Program Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        name="program"
                        label="Program"
                        value={selectedProgram}
                        placeholder="All Programs"
                        options={programOptions}
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
                <!-- Course Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        name="course"
                        label="Course"
                        value={selectedCourse}
                        placeholder="All Courses"
                        options={courseOptions}
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>

                

                <!-- Term Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        name="term"
                        label="Term"
                        value={selectedTerm}
                        placeholder="All Terms"
                        options={termOptions}
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>

                <!-- Venue/Mode Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        name="venueMode"
                        label="Venue / Mode"
                        value={selectedVenueMode}
                        placeholder="All Venues/Modes"
                        options={venueModeOptions}
                        onchange={handleFilterChange}>
                    </lightning-combobox>
                </div>
            </div>

            <!-- Clear Filters Button -->
            <div class="slds-m-top_small slds-m-bottom_small">
                <lightning-button
                    label="Clear Filters"
                    onclick={handleClearFilters}
                    variant="neutral"
                    icon-name="utility:clear">
                </lightning-button>
            </div>
        </div>

        <template if:true={loading}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={loading}>
            <template if:true={filteredRecords}>
                <div class="slds-p-horizontal_medium slds-p-bottom_x-small">
                    <p class="slds-text-body_small slds-text-color_weak">
                        Showing {filteredRecords.length} of {totalRecords} records
                    </p>
                </div>
                <lightning-datatable
                    key-field="examAAId"
                    data={filteredRecords}
                    columns={columns}
                    hide-checkbox-column
                    is-loading={loading}>
                </lightning-datatable>
            </template>
            <template if:false={filteredRecords}>
                <div class="slds-p-around_medium">
                    <p>No upcoming invigilation assignments found.</p>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
