<template>
    <lightning-card title="My Fees & Payments" icon-name="custom:custom63">

        <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>

            <!-- SECTION 1: MY FEES -->
            <lightning-accordion-section name="fees" label="My Fees">

                <!-- Loading Spinner -->
                <template if:true={isLoadingFees}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading fees..." size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Error Message -->
                <template if:true={feesError}>
                    <div class="slds-m-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <h2>
                                <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                    class="slds-m-right_x-small"></lightning-icon>
                                Error loading fees
                            </h2>
                            <p class="slds-m-top_x-small">{feesError}</p>
                        </div>
                    </div>
                </template>

                <!-- Fees Table -->
                <template if:true={hasFees}>
                    <div class="slds-m-around_medium">
                        <div class="fee-table-container">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered fee-table">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 20%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Fee Name">
                                                <strong>Fee Name</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 10%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Due Date">
                                                <strong>Due Date</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 10%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Amount">
                                                <strong>Amount</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 13%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Fee Type">
                                                <strong>Fee Type</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 12%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Remark">
                                                <strong>Remark</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 12%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Cohort">
                                                <strong>Cohort</strong>
                                            </div>
                                        </th>
                                        <th scope="col" style="width: 25%;">
                                            <div class="slds-truncate slds-text-title_caps" title="Actions">
                                                <strong>Actions</strong>
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={fees} for:item="record">
                                        <tr key={record.Id} class="fee-row">
                                            <!-- Fee Name with Fee Breakage Link -->
                                            <td role="gridcell" data-label="Fee Name">
                                                <div class="slds-media slds-media_center">
                                                    <div class="slds-media__figure">
                                                        <lightning-icon icon-name="standard:account" size="small">
                                                        </lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <div class="slds-text-body_regular" title={record.Name}>
                                                            <strong>{record.Name}</strong>
                                                        </div>
                                                        <template if:true={record.isInstallmentFee}>
                                                            <a href="#" class="slds-text-link_reset fee-breakage-link"
                                                                data-record-id={record.Id}
                                                                onclick={handleViewFeeBreakage}>
                                                                <lightning-icon icon-name="utility:info" size="xx-small"
                                                                    class="slds-m-right_xx-small"></lightning-icon>
                                                                View Fee Breakage
                                                            </a>
                                                        </template>
                                                    </div>
                                                </div>
                                            </td>

                                            <!-- Due Date -->
                                            <td role="gridcell" data-label="Due Date">
                                                <template if:true={record.Due_Date__c}>
                                                    <div class="due-date-cell">
                                                        <lightning-icon icon-name="utility:event" size="xx-small"
                                                            class="slds-m-right_xx-small date-icon"></lightning-icon>
                                                        <lightning-formatted-date-time value={record.Due_Date__c}
                                                            year="numeric" month="short" day="2-digit">
                                                        </lightning-formatted-date-time>
                                                    </div>
                                                </template>
                                                <template if:false={record.Due_Date__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Amount (using Fee_Amount__c) -->
                                            <td role="gridcell" data-label="Amount">
                                                <template if:true={record.Fee_Amount__c}>
                                                    <div class="amount-cell">
                                                        <lightning-formatted-number value={record.Fee_Amount__c}
                                                            format-style="currency" currency-code="INR"
                                                            minimum-fraction-digits="2">
                                                        </lightning-formatted-number>
                                                    </div>
                                                </template>
                                                <template if:false={record.Fee_Amount__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- <Installment Number (using Fee_Type__c) -->
                                            <td role="gridcell" data-label="Fee Type">
                                                <template if:true={record.Fee_Type__c}>
                                                    <span class="installment-badge">
                        {record.Fee_Type__c}
                    </span>
                                                </template>
                                                <template if:false={record.Fee_Type__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <td role="gridcell" data-label="Remark">
                                                <template if:true={record.Remark__c}>
                                                    <div class="slds-truncate" title={record.Remark__c}>
                                                        {record.Remark__c}
                                                    </div>
                                                </template>
                                                <template if:false={record.Remark__c}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Cohort (from Academic Term) -->
                                            <td role="gridcell" data-label="Cohort">
                                                <template if:true={record.cohortName}>
                                                    <lightning-badge label={record.cohortName} class="program-badge">
                                                    </lightning-badge>
                                                </template>
                                                <template if:false={record.cohortName}>
                                                    <span class="slds-text-color_weak">—</span>
                                                </template>
                                            </td>

                                            <!-- Actions Column -->
                                            <td role="gridcell" style="padding: 0.75rem 1rem;" data-label="Actions">
                                                <!-- PAID Status -->
                                                <template if:true={record.isPaid}>
                                                    <div class="action-container paid-container">
                                                        <div class="status-badge-container">
                                                            <lightning-icon icon-name="utility:success" size="x-small"
                                                                variant="success" class="slds-m-right_xx-small">
                                                            </lightning-icon>
                                                            <span class="status-text-paid">Paid</span>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- Under Verification Status -->
                                                <template if:true={record.isUnderVerification}>
                                                    <div class="action-container verification-container">
                                                        <div class="status-badge-container">
                                                            <lightning-icon icon-name="utility:clock" size="x-small"
                                                                variant="warning" class="slds-m-right_xx-small">
                                                            </lightning-icon>
                                                            <span class="status-text-verification">Payment under verification</span>
                                                        </div>
                                                        <p
                                                            class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                            Verification may take 1-2 business days
                                                        </p>
                                                    </div>
                                                </template>

                                                <!-- NOT PAID Status -->
                                                <template if:false={record.isPaid}>
                                                    <template if:false={record.isUnderVerification}>
                                                        <!-- Can Pay Now -->
                                                        <template if:true={record.canPayNow}>
                                                            <div class="pay-now-row">
                                                                <c-payment record-id={record.Id}
                                                                    onpaymentsuccess={handlePaymentSuccess}></c-payment>

                                                                <template if:true={record.isOverdue}>
                                                                    <div class="overdue-alert">
                                                                        <lightning-icon icon-name="utility:warning"
                                                                            size="x-small" variant="warning"
                                                                            class="slds-m-right_xx-small">
                                                                        </lightning-icon>
                                                                        <span class="overdue-text">
                                        Payment Overdue - Due: {record.formattedDueDate}
                                    </span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>

                                                        <template if:false={record.canPayNow}>
                                                            <div class="pay-now-row">
                                                                <lightning-button label="Pay Now" variant="brand"
                                                                    disabled class="disabled-pay-button">
                                                                </lightning-button>
                                                            </div>
                                                        </template>

                                                        <!-- Payment Not Yet Available -->
                                                        <template if:true={record.isPaymentNotYetAvailable}>
                                                            <div class="info-message">
                                                                <lightning-icon icon-name="utility:info" size="x-small"
                                                                    class="slds-m-right_xx-small info-icon">
                                                                </lightning-icon>
                                                                <span class="info-text">
                                Payment available from <strong>{record.paymentAvailableFromDate}</strong>
                            </span>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <!-- Total Count -->
                        <div class="slds-m-top_medium slds-p-horizontal_medium">
                            <p class="slds-text-body_small slds-text-color_weak">
                                <lightning-icon icon-name="utility:layers" size="xx-small"
                                    class="slds-m-right_xx-small">
                                </lightning-icon>
                                Showing {totalFees} fee{pluralSuffixFees}
                            </p>
                        </div>
                    </div>
                </template>

                <!-- Empty State for Fees -->
                <template if:false={hasFees}>
                    <template if:false={isLoadingFees}>
                        <template if:false={feesError}>
                            <div class="slds-align_absolute-center slds-p-around_xx-large">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="custom:custom63" size="large"
                                        class="slds-m-bottom_medium empty-state-icon">
                                    </lightning-icon>
                                    <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No Fees Available</h3>
                                    <p class="slds-text-body_regular slds-text-color_weak">
                                        You don't have any fees at this time.
                                    </p>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

            </lightning-accordion-section>

            <!-- SECTION 2: MY PAYMENTS -->
            <lightning-accordion-section name="payments" label="My Payments">

                <!-- Loading Spinner -->
                <template if:true={isLoadingPayments}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <lightning-spinner alternative-text="Loading payments..." size="medium"></lightning-spinner>
                    </div>
                </template>

                <!-- Error Message -->
                <template if:true={paymentsError}>
                    <div class="slds-m-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <h2>
                                <lightning-icon icon-name="utility:error" size="x-small" alternative-text="Error"
                                    class="slds-m-right_x-small"></lightning-icon>
                                Error loading payments
                            </h2>
                            <p class="slds-m-top_x-small">{paymentsError}</p>
                        </div>
                    </div>
                </template>

                <!-- Payments Table -->
                <template if:true={hasPayments}>
                    <div class="slds-m-around_medium">
                        <table class="slds-table slds-table_cell-buffer slds-table_bordered payment-table">
                            <thead>
                                <tr>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Payment</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Payment Type</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Date</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Amount Paid</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Mode</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Status</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Comments</strong>
                                        </div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate slds-text-title_caps">
                                            <strong>Action</strong>
                                        </div>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={payments} for:item="p">
                                    <tr key={p.Id}>
                                        <!-- <td data-label="Payment"><strong>{p.Name}</strong></td> -->
                                        <td data-label="Payment">
                                            <!-- SAP Payment: Make name readonly -->
                                            <template if:true={p.isSAPPayment}>
                                                <span class="payment-name-readonly">
                                                    {p.Name}
                                                </span>
                                            </template>
                                            <!-- Non-SAP Payment: Clickable link -->
                                            <template if:false={p.isSAPPayment}>
                                                <a href="#" class="payment-link" data-id={p.Id} data-name={p.Name}
                                                    onclick={handlePaymentClick}>
                                                    {p.Name}
                                                </a>
                                            </template>
                                        </td>
                                        <td data-label="Payment Type">{p.paymentType}</td>
                                        <td data-label="Date">{p.paymentDate}</td>
                                        <td data-label="Amount">{p.formattedAmount}</td>
                                        <td data-label="Mode">{p.Payment_Mode__c}</td>
                                        <td data-label="Status">
                                            <span class={p.statusClass}>
                                                {p.Initiated__c}
                                            </span>
                                        </td>
                                        <td data-label="Comments">
                                            <template if:true={p.hasComments}>
                                                <div class="slds-media slds-media_small" title={p.comments}>
                                                    <div class="slds-media__figure">
                                                        <lightning-icon size="xx-small" variant="warning"
                                                            class="slds-m-right_xx-small">
                                                        </lightning-icon>
                                                    </div>
                                                    <div class="slds-media__body">
                                                        <span class="slds-text-color_weak slds-truncate">{p.comments}</span>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={p.hasComments}>
                                                <span class="slds-text-color_weak">—</span>
                                            </template>
                                        </td>
                                        <td data-label="Action">
                                            <!-- SAP Payment: Show info badge -->
                                            <template if:true={p.isSAPPayment}>
                                                <div class="sap-payment-badge">
                                                    <lightning-icon icon-name="utility:info_alt" size="x-small" 
                                                        style="color: #0076d6; flex-shrink: 0;">
                                                    </lightning-icon>
                                                    <span class="sap-payment-text">
                                                        This payment was collected in SAP. Please check SAP for the payment details.
                                                    </span>
                                                </div>
                                            </template>
                                            <!-- Non-SAP Payment: Show download button -->
                                            <template if:false={p.isSAPPayment}>
                                                <template if:true={p.isSuccess}>
                                                    <lightning-button label="Download Receipt" icon-name="utility:download"
                                                        data-id={p.Id} onclick={handleDownloadInvoice}
                                                        variant="brand-outline">
                                                    </lightning-button>
                                                </template>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>

                        <!-- Total Count -->
                        <div class="slds-m-top_medium">
                            <p class="slds-text-body_small slds-text-color_weak">
                                <lightning-icon icon-name="utility:layers" size="xx-small"
                                    class="slds-m-right_xx-small">
                                </lightning-icon>
                                Showing {totalPayments} payment{pluralSuffixPayments}
                            </p>
                        </div>
                    </div>
                </template>

                <!-- Empty State for Payments -->
                <template if:false={hasPayments}>
                    <template if:false={isLoadingPayments}>
                        <template if:false={paymentsError}>
                            <div class="slds-align_absolute-center slds-p-around_xx-large">
                                <div class="slds-text-align_center">
                                    <lightning-icon icon-name="custom:custom63" size="large"
                                        class="slds-m-bottom_medium empty-state-icon">
                                    </lightning-icon>
                                    <h3 class="slds-text-heading_medium slds-m-bottom_x-small">No Payments Available
                                    </h3>
                                    <p class="slds-text-body_regular slds-text-color_weak">
                                        You don't have any payments at this time.
                                    </p>
                                </div>
                            </div>
                        </template>
                    </template>
                </template>

            </lightning-accordion-section>

        </lightning-accordion>

    </lightning-card>


    <!-- Fee Breakage Modal -->
    <template if:true={isFeeBreakageModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container" style="max-width: 600px;">
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeFeeBreakageModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Fee Breakage Details</h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Loading State -->
                    <template if:true={isLoadingBreakage}>
                        <div class="slds-align_absolute-center slds-p-around_large">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Fee Breakdown -->
                    <template if:false={isLoadingBreakage}>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-border_top slds-border_bottom slds-p-around_small">
                                <template for:each={selectedFeeBreakdown} for:item="item">
                                    <div key={item.feeType}
                                        class="slds-grid slds-grid_align-spread slds-text-body_regular slds-m-vertical_x-small">
                                        <span class="slds-col slds-text-color_weak">{item.feeType}</span>
                                        <!-- <span class="slds-col slds-text-align_right"><strong>₹{item.amount}</strong></span> -->
                                        <span class="slds-col slds-text-align_right">
                            <strong>₹{item.amount}</strong>
                            <template if:true={item.hasScholarship}>
                                <span style="color: #2e844a; margin-left: 8px;">
                                    (Scholarship: ₹{item.scholarshipAmount})
                                </span>
                                </template>
                                </span>
                            </div>
                    </template>

                    <div
                        class="slds-grid slds-grid_align-spread slds-text-title slds-m-top_small slds-border_top slds-p-top_small">
                        <span class="slds-col"><strong>Total Fee:</strong></span>
                        <span class="slds-col slds-text-align_right"><strong>₹{selectedTotalAmount}</strong></span>
                    </div>
                </div>

                <p class="slds-text-body_small slds-m-top_small" style="color: #c90000;">
                    * Transaction charges are extra and borne by the payer.
                </p>
            </div>
    </template>
    </div>

    <!-- Footer -->
    <footer class="slds-modal__footer">
        <lightning-button variant="neutral" label="Close" onclick={closeFeeBreakageModal}>
        </lightning-button>
    </footer>
    </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
</template>
