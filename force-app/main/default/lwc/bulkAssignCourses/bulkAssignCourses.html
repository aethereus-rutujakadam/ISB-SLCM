<template>
    <!-- MODE 1: Record Page (Quick Action Modal) -->
    <template if:true={isRecordPage}>
        <lightning-quick-action-panel header="Bulk Assign Students">
            
            <div class="slds-p-around_small">
                <!-- Context Info -->
                <div class="slds-grid slds-gutters slds-m-bottom_medium slds-border_bottom slds-p-bottom_small">
                    <div class="slds-col slds-size_1-of-4">
                        <p class="slds-form-element__label">Program</p>
                        <p class="slds-text-body_regular">{programName}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <p class="slds-form-element__label">Academic Term</p>
                        <p class="slds-text-body_regular">{academicTermName}</p>
                    </div>
                     <div class="slds-col slds-size_1-of-4">
                        <p class="slds-form-element__label">Target Course</p>
                        <p class="slds-text-body_regular">{targetCourseName}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-4">
                        <lightning-combobox
                            label="Course Type"
                            placeholder="Select Course Type"
                            options={courseTypeOptions}
                            value={globalCourseType}
                            onchange={handleGlobalCourseTypeChange}
                            required>
                        </lightning-combobox>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </template>
                
                <!-- Custom Table -->
                <template if:true={hasResults}>
                    <div class="table-container">
                        <div class="table-wrapper" style="max-height: 300px;">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 3.25rem;">
                                            <div class="slds-th__action slds-th__action_form">
                                                <lightning-input type="checkbox" 
                                                    onchange={handleSelectAll}
                                                    checked={allSelected}>
                                                </lightning-input>
                                            </div>
                                        </th>
                                        <th scope="col">Student Name</th>
                                        <th scope="col">Program Enrollment ID</th>
                                        <th scope="col">Enrolled Term</th>
                                        <th scope="col">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={students} for:item="student">
                                        <tr key={student.Id}>
                                            <td>
                                                <lightning-input type="checkbox" 
                                                    data-id={student.Id}
                                                    data-contact-id={student.ContactId}
                                                    onchange={handleRowCheckboxChange}
                                                    checked={student.isSelected}>
                                                </lightning-input>
                                            </td>
                                            <td>{student.StudentName}</td>
                                            <td>{student.Name}</td>
                                            <td>{student.EnrolledTerm}</td>
                                            <td>{student.Status}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="slds-m-top_x-small">
                        <p>{students.length} students found.</p>
                    </div>
                </template>
                
                <template if:false={hasResults}>
                    <div class="slds-align_absolute-center slds-p-around_large slds-text-color_weak">
                        No active program enrollments found for this Program and Term.
                    </div>
                </template>
            </div>

            <div slot="footer">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button variant="brand" label="Assign" onclick={handleAssign}></lightning-button>
            </div>
        </lightning-quick-action-panel>
    </template>

    <!-- MODE 2: Tab / Full Page -->
    <template if:false={isRecordPage}>
        <lightning-card title="Bulk Assign Students to Course" icon-name="standard:groups">
            <div class="slds-p-around_medium">
                
                <!-- Filters -->
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Filter Criteria</h3>
                    
                    <!-- Row 1: Program, Academic Term, Academic Session -->
                    <div class="slds-grid slds-gutters slds-m-bottom_small">
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-record-picker
                                label="Program"
                                placeholder="Select Program..."
                                object-api-name={programObjectApiName}
                                value={programId}
                                onchange={handleProgramChange}>
                            </lightning-record-picker>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="Academic Cohort (Term)"
                                placeholder="Select Academic Term..."
                                options={academicTermOptions}
                                value={academicTermId}
                                onchange={handleTermChange}
                                disabled={isLoading}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <lightning-combobox
                                label="Academic Session"
                                placeholder="Select Academic Session..."
                                options={academicSessionOptions}
                                value={academicSessionId}
                                onchange={handleSessionChange}
                                disabled={isLoading}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Row 2: Search Button -->
                    <div class="slds-grid slds-gutters">
                        <div class="slds-col slds-size_1-of-1">
                            <lightning-button 
                                label="Search Students" 
                                variant="brand" 
                                onclick={handleSearch} 
                                disabled={isLoading}
                                class="slds-float_right">
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Target Course Selection -->
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Learning Course"
                            placeholder="Select Learning Course..."
                            options={learningCourseOptions}
                            value={learningCourseId}
                            onchange={handleLearningCourseChange}
                            disabled={isLoading}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Target Course Offering"
                            placeholder="Select Course Offering..."
                            options={courseOfferingOptions}
                            value={targetCourseId}
                            onchange={handleCourseChange}
                            disabled={isLoading}
                            required>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <lightning-combobox
                            label="Course Type"
                            placeholder="Select Course Type..."
                            options={courseTypeOptions}
                            value={globalCourseType}
                            onchange={handleGlobalCourseTypeChange}
                            disabled={isLoading}
                            required>
                        </lightning-combobox>
                    </div>
                </div>

                <!-- Results -->
                <template if:true={isSearchPerformed}>
                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_small slds-grid_vertical-align-center">
                        <div>
                            <strong>Found {students.length} students.</strong>
                        </div>
                        <div>
                            <lightning-button 
                                label="Assign Selected Students" 
                                variant="success" 
                                onclick={handleAssign}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                    </div>
                    
                    <!-- Custom Table -->
                    <div class="table-container">
                        <div class="table-wrapper" style="max-height: 500px;">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table_striped">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" style="width: 3.25rem;">
                                            <div class="slds-th__action slds-th__action_form">
                                                <lightning-input type="checkbox" 
                                                    onchange={handleSelectAll}
                                                    checked={allSelected}>
                                                </lightning-input>
                                            </div>
                                        </th>
                                        <th scope="col">Student Name</th>
                                        <th scope="col">Program Enrollment ID</th>
                                        <th scope="col">Enrolled Term</th>
                                        <th scope="col">Status</th>
                                        <th scope="col">Start Date</th>
                                        <th scope="col">End Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={students} for:item="student">
                                        <tr key={student.Id}>
                                            <td>
                                                <lightning-input type="checkbox" 
                                                    data-id={student.Id}
                                                    data-contact-id={student.ContactId}
                                                    onchange={handleRowCheckboxChange}
                                                    checked={student.isSelected}>
                                                </lightning-input>
                                            </td>
                                            <td>{student.StudentName}</td>
                                            <td>{student.Name}</td>
                                            <td>{student.EnrolledTerm}</td>
                                            <td>{student.Status}</td>
                                            <td>
                                                <lightning-formatted-date-time 
                                                    value={student.StartDate}
                                                    year="numeric" 
                                                    month="short" 
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                            </td>
                                            <td>
                                                <lightning-formatted-date-time 
                                                    value={student.EndDate}
                                                    year="numeric" 
                                                    month="short" 
                                                    day="2-digit">
                                                </lightning-formatted-date-time>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </template>
                
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading..."></lightning-spinner>
                </template>
            </div>
        </lightning-card>
    </template>
</template>
