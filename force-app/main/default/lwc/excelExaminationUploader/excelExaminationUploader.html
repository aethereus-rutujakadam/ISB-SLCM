<template>
    <lightning-card title="Excel Examination Upload" icon-name="custom:custom19">
        <div class="card-container">

            <!-- Upload Section -->
            <div class="upload-section slds-p-around_medium">
                <lightning-input
                    type="file"
                    label="Upload Excel File"
                    accept=".xls,.xlsx"
                    onchange={handleFileChange}
                    disabled={isLoading}>
                </lightning-input>

                <template if:true={fileName}>
                    <div class="file-info slds-m-top_small">
                        <span class="file-icon">📄</span>
                        <span class="file-name"><strong>Uploaded File:</strong> {fileName}</span>
                        <span class="record-count slds-badge">({fileData.length} records)</span>
                    </div>
                </template>

                <template if:true={isLoading}>
                    <div class="loading-spinner slds-m-top_medium">
                        <lightning-spinner alternative-text="Processing" size="small"></lightning-spinner>
                        <span class="slds-m-left_small">Processing file...</span>
                    </div>
                </template>

                <template if:true={fileName}>
                    <template if:true={hasNoData}>
                        <div class="slds-m-top_small slds-text-color_error">
                            No valid data found in the file. Please check the Excel format.
                        </div>
                    </template>
                </template>
            </div>

            <!-- Data Preview -->
            <template if:true={hasPreviewData}>
                <div class="preview-section">
                    <div class="preview-header slds-p-around_medium">
                        <h3 class="slds-text-heading_small">Data Preview</h3>
                        <p class="slds-text-body_small slds-m-top_x-small">
                            Review the data before submitting. Only valid records will be created.
                        </p>
                    </div>
                    <div class="data-table-container">
                        <lightning-datatable
                            key-field="id"
                            data={previewData}
                            columns={dynamicColumns}
                            hide-checkbox-column="true"
                            show-row-number-column="true"
                            resize-column-disabled="true"
                            wrap-text-max-lines="3">
                        </lightning-datatable>
                    </div>
                </div>
            </template>
            <!-- ERROR SECTION -->
<template if:true={errorData.length}>
    <div class="error-section">
        <div class="error-title-row">
            <h3>Errors Found ({errorData.length}) — Fix issues or download CSV</h3>
            <lightning-button 
                variant="destructive"
                label="Download Error CSV"
                icon-name="utility:download"
                class="error-download-btn"
                onclick={downloadErrorCSV}>
            </lightning-button>
        </div>

        <div class="error-table-container">
            <lightning-datatable
                key-field="id"
                data={errorData}
                columns={dynamicColumns}
                hide-checkbox-column="true"
                show-row-number-column="true"
                resize-column-disabled="true"
                class="datatable-error-ui">
            </lightning-datatable>
        </div>
    </div>
</template>
            <!-- Buttons -->
            <div class="action-section slds-p-around_medium">
                <lightning-button
                    label="Submit Examinations"
                    variant="brand"
                    onclick={handleSubmit}
                    disabled={isSubmitDisabled}
                    class="submit-button">
                </lightning-button>

                <lightning-button
                    label="Clear"
                    variant="neutral"
                    onclick={resetForm}
                    disabled={isLoading}
                    class="clear-button">
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
